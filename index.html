<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:1000;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button{
cursor:pointer;
padding:8px;
border:none;
border-radius:8px;
margin-top:6px;
}

.buy{background:#111;color:#fff}

.cart{
position:fixed;
right:0;
top:0;
width:340px;
height:100%;
background:#fff;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.25s;
display:flex;
flex-direction:column;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}

.admin{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
}

.admin.open{transform:translateX(0)}

.admin input{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:none;
}

.admin button{
background:#fff;
color:#111;
width:100%;
}
</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<div>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
<button onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
<button onclick="toggleAdmin()">Admin</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>✨ Tienda funcional</h2>
<p>Inventario estable con carrito y admin.</p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="toggleCart()">Cerrar carrito</button>
<div class="cartBody" id="cartList"></div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Login Admin</h3>

<div id="loginBox">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="panel" style="display:none">

<h3>Panel</h3>

<input id="pname" placeholder="Nombre producto">
<input id="pprice" placeholder="Precio">
<button onclick="addProduct()">Agregar</button>

<hr>

<div id="adminList"></div>

</div>

</div>

<script>

/* ADMIN */
const adminUser="admin";
const adminPass="1234";

/* INVENTARIO */
  let products = [
{id:1,name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg",stock:3},
{id:2,name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",stock:5},
{id:3,name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",stock:5},
{id:4,name:"AOA Retro Chic Lipstick",price:70,img:"lipstick_mod.jpg",stock:1},
{id:5,name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",stock:2},
{id:6,name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",stock:2},
{id:7,name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",stock:3},
{id:8,name:"AOA Magical Lip Stain",price:75,img:"lip_kuu.jpg",stock:2},
{id:9,name:"AOA Headband Soft",price:45,img:"headband_pink_ears.jpg",stock:2},
{id:10,name:"AOA Wonder Blender",price:45,img:"blender_pink.jpg",stock:2}
];

];

let cart=[];

/* LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u===adminUser && p===adminPass){
document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";
renderAdmin();
}else{
alert("Login incorrecto");
}
}

/* SHOP */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<p>Stock: ${p.stock}</p>

<button class="buy" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>
Agregar
</button>
</div>
`;
});

renderCart();
renderAdmin();
}

/* ADD CART */
function add(id){
let p=products.find(x=>x.id===id);
if(!p || p.stock<=0) return;

p.stock--;
cart.push({id:p.id,name:p.name,price:p.price});
render();
}

/* CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

cart.forEach((c,i)=>{
box.innerHTML+=`
<div>
<b>${c.name}</b>
<button onclick="removeItem(${i})">Eliminar</button>
</div>
`;
});

document.getElementById("count").innerText=cart.length;
}

/* REMOVE CART */
function removeItem(i){
let item=cart[i];
let p=products.find(x=>x.id===item.id);

if(p) p.stock++;

cart.splice(i,1);
render();
}

/* ADMIN */
function renderAdmin(){
let box=document.getElementById("adminList");
if(!box) return;

box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div style="border-bottom:1px solid #444;padding:6px 0">
${p.name} - $${p.price} - Stock: ${p.stock}
<button onclick="deleteProduct(${p.id})">Eliminar</button>
</div>
`;
});
}

/* DELETE ADMIN */
function deleteProduct(id){
products=products.filter(p=>p.id!==id);
render();
}

/* ADD PRODUCT */
function addProduct(){

let name=document.getElementById("pname").value;
let price=parseFloat(document.getElementById("pprice").value);

if(!name) return;

let existing=products.find(p=>p.name.toLowerCase()===name.toLowerCase());

if(existing){
existing.stock++;
}else{
products.push({
id:Date.now(),
name,
price:price||50,
img:"default.jpg",
stock:5
});
}

render();
}

/* UI */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function toggleAdmin(){
document.getElementById("admin").classList.toggle("open");
}

render();

</script>

</body>
</html>
