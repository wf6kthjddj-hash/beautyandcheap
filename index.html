<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{
margin:0;
font-family:system-ui,Segoe UI,Arial;
background:#f6f6f8;
color:#111;
}

/* HEADER */
header{
background:#0e0e10;
color:#fff;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
font-weight:600;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:20px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

select{
width:100%;
padding:8px;
margin-top:5px;
border-radius:8px;
border:1px solid #ddd;
}

button.buy{
width:100%;
padding:10px;
margin-top:10px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:#fff;
padding:10px;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.3s;
z-index:9999;
}

.cart.open{transform:translateX(0)}

.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:9998;
}

.backdrop.show{
opacity:1;
visibility:visible;
}

/* 🟣 ADMIN BOTÓN FLOTANTE */
.adminBtn{
position:fixed;
left:20px;
bottom:20px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:grab;
font-weight:600;
z-index:10001;
box-shadow:0 10px 25px rgba(0,0,0,.25);
user-select:none;
}

.adminBtn:active{cursor:grabbing}

/* ADMIN PANEL */
.adminPanel{
position:fixed;
left:0;
top:0;
width:360px;
height:100%;
background:#111;
color:#fff;
padding:12px;
overflow:auto;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

.closeAdmin{
background:none;
border:none;
color:#fff;
font-size:20px;
float:right;
cursor:pointer;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

/* STOCK ALERT */
.stock{
font-size:12px;
opacity:.7;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active" style="padding:20px">
<h2>✨ Beauty & Cheap ✨</h2>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>

<div class="cart" id="cart">
<h3>🛒 Carrito</h3>
<ul id="list"></ul>
<p>Total: $<span id="total"></span></p>
</div>

<!-- ADMIN -->
<button class="adminBtn" id="adminBtn" onmousedown="dragStart(event)" onclick="login()">
Admin
</button>

<div class="adminPanel" id="admin">
<button class="closeAdmin" onclick="closeAdmin()">✖</button>

<h3>Panel Admin</h3>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen URL">
<button onclick="addProduct()">Guardar</button>

</div>

<script>

/* LOGIN */
let USER="admin";
let PASS=localStorage.getItem("adminPass") || "1234";

/* 🧠 INVENTARIO CON STOCK REAL */
let products = JSON.parse(localStorage.getItem("db")) || [
{
name:"AOA Brush Egg",
price:45,
img:"egg_black.jpg",
stock:{
black:2,
purple:1
},
options:["black","purple"]
},
{
name:"Cuticle Pen",
price:55,
img:"cuticle_peach.jpg",
stock:{
peach:1,
strawberry:2,
rose:2
},
options:["peach","strawberry","rose"]
},
{
name:"Lipstick Mod",
price:70,
img:"lipstick_mod.jpg",
stock:{mod:1},
options:["mod"]
}
];

let cart=[];
let total=0;

/* SAVE */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts = p.options.map(o=>{
return `<option value="${o}">${o}</option>`;
}).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="updateStock(${i})">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

/* STOCK CONTROL REAL */
function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

document.getElementById("stock"+i).innerText=
s>0 ? "Stock: "+s : "AGOTADO";
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

renderCart();
updateStock(i);
updateCount();
save();
}

/* CART */
function renderCart(){
document.getElementById("list").innerHTML=
cart.map(c=>`<li>${c.name} (${c.option}) - $${c.price}</li>`).join("");

document.getElementById("total").innerText=total;
}

function updateCount(){
document.getElementById("count").innerText=cart.length;
}

/* TOGGLE CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* ADMIN LOGIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");

if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
}else alert("Acceso denegado");
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADD PRODUCT */
function addProduct(){
let n=document.getElementById("n").value;
let p=parseFloat(document.getElementById("p").value);
let i=document.getElementById("i").value;

products.push({
name:n,
price:p,
img:i,
stock:{default:5},
options:["default"]
});

save();
render();
}

/* 🟣 DRAG BUTTON + MEMORY */
let drag=false,offX=0,offY=0;

function dragStart(e){
drag=true;

let btn=document.getElementById("adminBtn");
let r=btn.getBoundingClientRect();

offX=e.clientX-r.left;
offY=e.clientY-r.top;

document.addEventListener("mousemove",move);
document.addEventListener("mouseup",end);
}

function move(e){
if(!drag)return;

let btn=document.getElementById("adminBtn");
btn.style.left=(e.clientX-offX)+"px";
btn.style.top=(e.clientY-offY)+"px";
btn.style.bottom="auto";
btn.style.right="auto";

localStorage.setItem("adminPos",JSON.stringify({
x:btn.style.left,
y:btn.style.top
}));
}

function end(){
drag=false;
document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",end);
}

/* RESTORE POSITION */
window.onload=()=>{
let pos=JSON.parse(localStorage.getItem("adminPos"));
if(pos){
let btn=document.getElementById("adminBtn");
btn.style.left=pos.x;
btn.style.top=pos.y;
btn.style.bottom="auto";
}
render();
};

</script>

</body>
</html>
