<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 | Premium Store</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:#f4f4f7;
color:#111;
}

/* HEADER SEPHORA STYLE */
header{
background:rgba(255,255,255,.95);
backdrop-filter:blur(12px);
padding:14px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
}

.header-left{
font-weight:700;
letter-spacing:.5px;
}

.header-right{
display:flex;
gap:14px;
align-items:center;
}

header button{
background:none;
border:none;
cursor:pointer;
font-weight:500;
}

.cartBtn{
background:#111;
color:#fff;
padding:8px 12px;
border-radius:999px;
border:none;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:22px;
max-width:1200px;
margin:auto;
}

/* CARD PREMIUM */
.card{
background:#fff;
border-radius:18px;
padding:14px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.25s;
border:1px solid #eee;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 18px 40px rgba(0,0,0,.12);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:14px;
}

h4{
margin:8px 0;
font-size:16px;
}

p{
margin:4px 0;
opacity:.8;
}

select{
width:100%;
padding:10px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
background:#fafafa;
}

.buy{
width:100%;
margin-top:10px;
padding:11px;
border:none;
background:linear-gradient(135deg,#111,#333);
color:#fff;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.stock{
font-size:12px;
margin-top:6px;
opacity:.6;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:380px;
height:100%;
background:#fff;
border-left:1px solid #eee;
transform:translateX(100%);
transition:.3s;
display:flex;
flex-direction:column;
z-index:9999;
}

.cart.open{transform:translateX(0)}

.cartTop{
padding:16px;
font-weight:600;
border-bottom:1px solid #eee;
}

.cartBody{
flex:1;
overflow:auto;
padding:14px;
}

.cartItem{
border:1px solid #eee;
padding:12px;
border-radius:14px;
margin-bottom:10px;
}

.removeBtn{
background:#111;
color:#fff;
border:none;
padding:6px 10px;
border-radius:8px;
margin-top:6px;
cursor:pointer;
}

.cartFooter{
padding:14px;
border-top:1px solid #eee;
font-weight:600;
}

/* ADMIN */
.adminBtn{
position:fixed;
left:18px;
bottom:18px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:pointer;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
}

hr{opacity:.2;margin:14px 0}
</style>
</head>

<body>

<header>
<div class="header-left">💄 Beauty & Cheap</div>

<div class="header-right">
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>

<button class="cartBtn" onclick="toggleCart()">
🛒 <span id="count">0</span>
</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active" style="padding:20px">
<h2>✨ Belleza accesible con estilo premium</h2>
<p>Catálogo inspirado en tiendas tipo Sephora.</p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartTop">🛒 Carrito</div>
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">
Total: $<span id="total">0</span>
</div>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="openAdmin()">Admin</button>

<div class="adminPanel" id="admin">
<h3>Panel Admin</h3>
<button onclick="closeAdmin()">Cerrar</button>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<button onclick="addProduct()">Agregar</button>

<hr>

<h4>Inventario</h4>
<div id="adminList"></div>
</div>

<script>

/* 💄 INVENTARIO REAL RESTAURADO + AJUSTE WIPES */
let products = [
{name:"AOA Brush Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",options:["sin aroma"],stock:{"sin aroma":5}},
{name:"AOA Lipstick Retro Chic",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}},
{name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",options:["10mm"],stock:{"10mm":3}},
{name:"AOA Magical Girl Lip Stain",price:75,img:"lip_kuu.jpg",options:["kuu","hime"],stock:{kuu:1,hime:1}},
{name:"AOA Soft Headband",price:45,img:"headband_pink_ears.jpg",options:["pink","purple"],stock:{pink:1,purple:1}},
{name:"AOA Wonder Blender",price:45,img:"blender_pink.jpg",options:["pink","black"],stock:{pink:1,black:1}}
];

let cart=[];
let total=0;

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

update(i);
});

renderAdmin();
}

/* STOCK */
function update(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

document.getElementById("stock"+i).innerText="Stock: "+s;
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

render();
renderCart();
}

/* CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<b>${i.name}</b><br>
${i.option}<br>
$${i.price} x ${i.qty}
<button class="removeBtn" onclick="removeItem('${i.name}','${i.option}')">Eliminar</button>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

/* NAV */
function show(sec){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(sec).classList.add("active");
}

/* ADMIN */
function openAdmin(){
document.getElementById("admin").classList.add("open");
renderAdmin();
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

function renderAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div style="background:#222;padding:10px;margin-bottom:8px;border-radius:8px">
<b>${p.name}</b> - $${p.price}
<button onclick="del(${i})" style="margin-top:6px;background:red;color:#fff;border:none;padding:6px;border-radius:6px">
Eliminar
</button>
</div>
`;
});
}

/* ADD PRODUCT */
function addProduct(){
products.push({
name:n.value,
price:+p.value,
img:"default.jpg",
options:["default"],
stock:{default:5}
});

render();
}

/* DELETE */
function del(i){
products.splice(i,1);
render();
}

render();

</script>

</body>
</html>
