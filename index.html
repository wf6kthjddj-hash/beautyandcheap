<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty and Cheap</title>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; }

nav { background:#000; padding:12px; text-align:center; }
nav button {
  color:white; background:none; border:none;
  margin:10px; font-size:16px; cursor:pointer;
}

/* INICIO */
#inicio {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(135deg,#ffe4ec,#f3d1ff);
  overflow:hidden;
  position:relative;
}

.frases span {
  position:absolute;
  opacity:0.2;
  animation:flotar 12s linear infinite;
}

@keyframes flotar {
  from { transform:translateY(100vh); }
  to { transform:translateY(-100vh); }
}

/* PRODUCTOS */
.grid { display:flex; flex-wrap:wrap; justify-content:center; }

.producto {
  background:white;
  border-radius:12px;
  padding:15px;
  margin:12px;
  width:220px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.producto img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.stock.low { color:red; font-weight:bold; }

button {
  background:#000;
  color:white;
  border:none;
  padding:8px;
  width:100%;
  margin-top:8px;
}

</style>
</head>

<body>

<nav>
<button onclick="ver('inicio')">Inicio</button>
<button onclick="ver('productos')">Productos</button>
<button onclick="ver('carrito')">Carrito (<span id="count">0</span>)</button>
</nav>

<div id="inicio">
<h1>Beauty and Cheap 💄</h1>
<p>Glow sin gastar de más ✨</p>
<button onclick="ver('productos')">Comprar</button>
</div>

<div id="productos" class="grid" style="display:none;"></div>

<div id="carrito" style="display:none; padding:20px;">
<h2>Carrito 🛒</h2>
<ul id="lista"></ul>
<p>Total: $<span id="total">0</span></p>
<button onclick="comprar()">Comprar por WhatsApp</button>
</div>

<script>

// IMÁGENES REALES
const img = {
cuticle:{
peach:"https://www.shopmissa.com/cdn/shop/products/cuticle-oil-peach.jpg",
strawberry:"https://www.shopmissa.com/cdn/shop/products/cuticle-oil-strawberry.jpg",
rose:"https://www.shopmissa.com/cdn/shop/products/cuticle-oil-rose.jpg"
},
egg:{
black:"https://www.shopmissa.com/cdn/shop/products/brush-cleaning-egg-black.jpg",
purple:"https://www.shopmissa.com/cdn/shop/products/brush-cleaning-egg-purple.jpg"
},
wipes:"https://www.shopmissa.com/cdn/shop/products/makeup-remover-wipes.jpg",
lipstick:"https://www.shopmissa.com/cdn/shop/products/retro-chic-lipstick-mod.jpg",
foot:{
chamomile:"https://www.shopmissa.com/cdn/shop/products/chamomile-foot-mask.jpg",
peeling:"https://www.shopmissa.com/cdn/shop/products/foot-peeling-mask.jpg",
rose:"https://www.shopmissa.com/cdn/shop/products/rose-foot-mask.jpg"
},
acne:"https://www.shopmissa.com/cdn/shop/products/acne-patches.jpg",
lip:{
kuu:"https://www.shopmissa.com/cdn/shop/products/magical-lip-stain-kuu.jpg",
hime:"https://www.shopmissa.com/cdn/shop/products/magical-lip-stain-hime.jpg"
},
headband:{
pink:"https://www.shopmissa.com/cdn/shop/products/headband-pink-ears.jpg",
purple:"https://www.shopmissa.com/cdn/shop/products/headband-purple-ears.jpg"
},
blender:{
pink:"https://www.shopmissa.com/cdn/shop/products/pink-blender.jpg",
black:"https://www.shopmissa.com/cdn/shop/products/black-blender.jpg"
}
};

// STOCK
let stock = {
cuticle:{peach:1, strawberry:2, rose:2},
egg:{black:1, purple:1},
wipes:5,
lipstick:1,
foot:{chamomile:2, peeling:2, rose:2},
acne:3,
lip:{kuu:1, hime:1},
headband:{pink:1, purple:1},
blender:{pink:1, black:1}
};

// PRECIOS
let precios = {
cuticle:55, egg:55, wipes:60, lipstick:65,
foot:70, acne:60, lip:70, headband:70, blender:45
};

let productos = [
{tipo:"cuticle", opciones:["peach","strawberry","rose"]},
{tipo:"egg", opciones:["black","purple"]},
{tipo:"wipes"},
{tipo:"lipstick"},
{tipo:"foot", opciones:["chamomile","peeling","rose"]},
{tipo:"acne"},
{tipo:"lip", opciones:["kuu","hime"]},
{tipo:"headband", opciones:["pink","purple"]},
{tipo:"blender", opciones:["pink","black"]}
];

let carrito=[], total=0;

let cont=document.getElementById("productos");

productos.forEach(p=>{
let d=document.createElement("div");
d.className="producto";

let image = p.opciones ? img[p.tipo][p.opciones[0]] : img[p.tipo];

let select="";
if(p.opciones){
select=`<select onchange="cambiar('${p.tipo}')">
${p.opciones.map(o=>`<option value="${o}">${o}</option>`).join("")}
</select>`;
}

d.innerHTML=`
<img id="img-${p.tipo}" src="${image}">
<p>${p.tipo}</p>
<p>$${precios[p.tipo]}</p>
${select}
<p id="stock-${p.tipo}"></p>
<button onclick="add('${p.tipo}')">Agregar</button>
`;

cont.appendChild(d);
});

function cambiar(tipo){
let val=event.target.value;
document.getElementById("img-"+tipo).src=img[tipo][val];
}

function add(tipo){
let sel=document.querySelector(`#productos select[onchange*="${tipo}"]`);
let v=sel?sel.value:null;

if(typeof stock[tipo]==="object"){
if(stock[tipo][v]<=0)return alert("Agotado");
stock[tipo][v]--;
}else{
if(stock[tipo]<=0)return alert("Agotado");
stock[tipo]--;
}

carrito.push({tipo,v,precio:precios[tipo]});
total+=precios[tipo];
render();
}

function render(){
document.getElementById("count").textContent=carrito.length;
document.getElementById("total").textContent=total;

let l=document.getElementById("lista");
l.innerHTML="";
carrito.forEach((p,i)=>{
l.innerHTML+=`<li>${p.tipo} ${p.v||""} $${p.precio}
<button onclick="del(${i})">❌</button></li>`;
});
}

function del(i){
let p=carrito[i];
if(typeof stock[p.tipo]==="object"){
stock[p.tipo][p.v]++;
}else{
stock[p.tipo]++;
}
total-=p.precio;
carrito.splice(i,1);
render();
}

function comprar(){
let msg="Pedido:%0A";
carrito.forEach(p=>{
msg+=`${p.tipo} ${p.v||""} $${p.precio}%0A`;
});
msg+=`Total $${total}`;
window.open("https://wa.me/52664TU_NUMERO?text="+msg);
}

function ver(s){
["inicio","productos","carrito"].forEach(x=>{
document.getElementById(x).style.display="none";
});
document.getElementById(s).style.display = s==="productos"?"flex":"block";
}

</script>

</body>
</html>
