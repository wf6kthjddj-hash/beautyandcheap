<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:1000;
flex-wrap:wrap;
gap:10px;
}

#search{
padding:8px;
border:1px solid #ddd;
border-radius:8px;
width:200px;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:16px;
}

.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button{
cursor:pointer;
padding:8px;
border:none;
border-radius:8px;
margin-top:6px;
}

.buy{background:#111;color:#fff}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:360px;
height:100%;
background:#fff;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.25s;
display:flex;
flex-direction:column;
z-index:9999;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}

/* ADMIN */
.admin{
position:fixed;
left:0;
top:0;
width:680px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:18px;
overflow:auto;
z-index:10000;
}

.admin.open{transform:translateX(0)}

.admin input{
width:100%;
padding:9px;
margin-top:6px;
border-radius:8px;
border:none;
}

.admin button{
background:#fff;
color:#111;
width:100%;
margin-top:6px;
}

hr{border:0;border-top:1px solid #333;margin:14px 0}

.small{font-size:12px;opacity:.8}

.removeBtn{
background:#ff3b3b;
color:#fff;
margin-right:5px;
}
</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<input id="search" placeholder="Buscar producto..." oninput="render()">

<div>
<button onclick="show('shop')">Tienda</button>
<button onclick="openCart()">🛒 <span id="count">0</span></button>
<button onclick="openAdmin()">Admin</button>
</div>
</header>

<!-- SHOP -->
<div id="shop" class="section active">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="openCart()">Cerrar carrito</button>
<div class="cartBody" id="cartList"></div>

<p style="padding:10px">Total: $<span id="total">0</span></p>

<button onclick="checkout()" style="width:95%;margin:10px;background:#111;color:#fff;">
Pagar por WhatsApp
</button>

<input id="codeInput" placeholder="Código de compra" style="margin:10px">

<button onclick="verifyCode()" style="width:95%;background:#111;color:#fff;">
Verificar compra
</button>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Admin Panel PRO</h3>

<div id="loginBox">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="panel" style="display:none">

<button onclick="logout()">Cerrar sesión</button>

<hr>

<h4>🔐 Cambiar contraseña</h4>
<input id="newPass" type="password" placeholder="Nueva contraseña">
<button onclick="changePassword()">Actualizar</button>

</div>
</div>

<script>

/* 🔐 BASE SEGURA */
const DEFAULT_USER = "admin";
const DEFAULT_PASS = "1234";

let logged = localStorage.getItem("logged")==="true";

/* INVENTARIO */
let products=[
{id:1,name:"AOA Brush Egg Black",price:45,img:"egg_black.jpg",stock:2},
{id:2,name:"AOA Brush Egg Purple",price:45,img:"egg_purple.jpg",stock:2},
{id:3,name:"Cuticle Oil Peach",price:50,img:"cuticle_peach.jpg",stock:5},
{id:4,name:"Cuticle Oil Strawberry",price:50,img:"cuticle_strawberry.jpg",stock:5},
{id:5,name:"Cuticle Oil Rose",price:50,img:"cuticle_rose.jpg",stock:5},
{id:6,name:"AOA Wipes Sin Aroma",price:50,img:"wipes.jpg",stock:5},
{id:7,name:"Lipstick Mod",price:70,img:"lipstick_mod.jpg",stock:3},
{id:8,name:"Foot Mask Chamomile",price:60,img:"foot_chamomile.jpg",stock:3},
{id:9,name:"Foot Peeling Mask",price:65,img:"foot_peeling.jpg",stock:3},
{id:10,name:"Foot Mask Rose",price:60,img:"foot_rose.jpg",stock:3},
{id:11,name:"Acne Patches",price:55,img:"acne_patches.jpg",stock:6},
{id:12,name:"Lip Oil Kuu",price:65,img:"lip_kuu.jpg",stock:4},
{id:13,name:"Lip Oil Hime",price:65,img:"lip_hime.jpg",stock:4},
{id:14,name:"Headband Pink Ears",price:40,img:"headband_pink_ears.jpg",stock:3},
{id:15,name:"Headband Purple Ears",price:40,img:"headband_purple_ears.jpg",stock:3},
{id:16,name:"Beauty Blender Pink",price:45,img:"blender_pink.jpg",stock:4},
{id:17,name:"Beauty Blender Black",price:45,img:"blender_black.jpg",stock:4}
];

let cart=[];
let pendingCode=null;

/* RENDER */
function render(){

let q=document.getElementById("search")?.value?.toLowerCase()||"";
let box=document.getElementById("products");
box.innerHTML="";

products.filter(p=>p.name.toLowerCase().includes(q))
.forEach(p=>{

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<p class="small">Stock: ${p.stock}</p>

<button class="buy" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>
Agregar
</button>
</div>
`;
});

renderCart();
syncUI();
}

/* CART */
function add(id){
let p=products.find(x=>x.id===id);
if(!p || p.stock<=0) return;

let count=cart.filter(c=>c.id===id).length;
if(count>=p.stock){alert("Sin stock");return;}

cart.push({...p});
render();
}

function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";
let total=0;

let grouped={};

cart.forEach(c=>{
grouped[c.id]=grouped[c.id]||{...c,qty:0};
grouped[c.id].qty++;
});

Object.values(grouped).forEach(item=>{
total+=item.price*item.qty;

box.innerHTML+=`
<div>
<b>${item.name}</b><br>
Cantidad: ${item.qty}<br>
$${item.price*item.qty}<br>

<button class="removeBtn" onclick="removeOne(${item.id})">-1</button>
<button onclick="removeAll(${item.id})">Eliminar</button>
</div>
<hr>
`;
});

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=total;
}

/* REMOVE CART */
function removeOne(id){
let i=cart.findIndex(c=>c.id===id);
if(i>-1) cart.splice(i,1);
render();
}

function removeAll(id){
cart=cart.filter(c=>c.id!==id);
render();
}

/* WHATSAPP */
function checkout(){
if(cart.length===0){alert("Carrito vacío");return;}

pendingCode=Math.floor(1000+Math.random()*9000);

let msg="Compra:%0A";
cart.forEach(c=>{
msg+=`- ${c.name} ($${c.price})%0A`;
});

msg+=`%0ACódigo: ${pendingCode}`;

window.open("https://wa.me/52TU_NUMERO_AQUI?text="+msg,"_blank");
}

/* VERIFY */
function verifyCode(){
let code=document.getElementById("codeInput").value;

if(code==pendingCode){
cart.forEach(c=>{
let p=products.find(x=>x.id===c.id);
if(p && p.stock>0) p.stock--;
});

cart=[];
pendingCode=null;
render();
alert("Compra confirmada ✔");
}else alert("Código incorrecto");
}

/* 🔐 LOGIN FIX REAL */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

let savedUser = localStorage.getItem("adminUser") || DEFAULT_USER;
let savedPass = localStorage.getItem("adminPass") || DEFAULT_PASS;

if(u===savedUser && p===savedPass){
logged=true;
localStorage.setItem("logged","true");
syncUI();
render();
}else{
alert("Credenciales incorrectas");
}
}

function logout(){
logged=false;
localStorage.setItem("logged","false");
syncUI();
}

/* UI */
function syncUI(){
let a=document.getElementById("loginBox");
let b=document.getElementById("panel");

if(!a||!b) return;

a.style.display=logged?"none":"block";
b.style.display=logged?"block":"none";
}

/* 🔐 CAMBIO DE PASS FIX */
function changePassword(){
let np=document.getElementById("newPass").value;

if(!np || np.length<4){
alert("Muy corta");
return;
}

localStorage.setItem("adminPass",np);
alert("Contraseña actualizada ✔");
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function openCart(){document.getElementById("cart").classList.toggle("open");}
function openAdmin(){document.getElementById("admin").classList.toggle("open");}

render();

</script>

</body>
</html>
