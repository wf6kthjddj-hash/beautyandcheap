<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{
font-family:Arial;
margin:0;
background:#fafafa;
color:#333;
}

header{
background:#111;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
position:relative;
}

nav{
display:flex;
justify-content:center;
gap:20px;
background:#222;
padding:10px;
}

nav button{
background:none;
border:none;
color:#fff;
font-size:16px;
cursor:pointer;
}

.section{display:none;padding:20px}
.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:10px;
padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button.buy{
background:#111;
color:#fff;
border:none;
padding:8px;
margin-top:10px;
width:100%;
cursor:pointer;
}

select{
width:100%;
padding:5px;
margin-top:5px;
}

/* 🌑 BACKDROP PREMIUM */
.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(6px);
opacity:0;
visibility:hidden;
transition:0.25s ease;
z-index:9998;
}

.backdrop.show{
opacity:1;
visibility:visible;
}

/* 🛒 CART PREMIUM GLASS */
.cart{
position:fixed;
right:0;
top:0;
width:330px;
height:100%;
background:rgba(255,255,255,0.92);
backdrop-filter:blur(14px);
border-left:1px solid rgba(0,0,0,0.08);
padding:12px;
overflow:auto;

transform:translateX(105%);
transition:transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
z-index:9999;

box-shadow:-10px 0 30px rgba(0,0,0,0.15);
}

.cart.open{
transform:translateX(0);
}

/* CLOSE BUTTON */
.closeBtn{
background:none;
border:none;
font-size:22px;
cursor:pointer;
float:right;
opacity:0.7;
transition:0.2s;
}

.closeBtn:hover{
opacity:1;
transform:scale(1.1);
}

/* CART HEADER */
.cart h3{
margin-top:10px;
font-weight:600;
letter-spacing:0.5px;
}

/* CART COUNT */
#cartCount{
background:#fff;
color:#111;
padding:2px 8px;
border-radius:20px;
font-size:12px;
margin-left:5px;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="cartCount">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Tu glow empieza aquí ✨</h2>
<p>Maquillaje accesible, cute y de calidad 💋</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- 🌑 BACKDROP -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>

<!-- 🛒 CART -->
<div class="cart" id="cartPanel">
<button class="closeBtn" onclick="toggleCart()">✖</button>

<h3>🛒 Carrito</h3>
<ul id="cart"></ul>
<p>Total: $<span id="total">0</span></p>
</div>

<script>

/* PRODUCTOS (NO TOCADO) */
const products=[
{
name:"AOA Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:[
{label:"Black",key:"black"},
{label:"Purple",key:"purple"}
],
stock:{black:1,purple:1}
},
{
name:"AOA Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:[
{label:"Peach",key:"peach"},
{label:"Strawberry",key:"strawberry"},
{label:"Rose",key:"rose"}
],
stock:{peach:1,strawberry:2,rose:2}
},
{
name:"AOA Makeup Remover Wipes",
price:50,
img:"wipes.jpg",
options:[{label:"Único",key:"default"}],
stock:{default:5}
},
{
name:"AOA Retro Chic Lipstick",
price:70,
img:"lipstick_mod.jpg",
options:[{label:"Mod",key:"mod"}],
stock:{mod:1}
},
{
name:"AOA Chamomile Foot Mask",
price:65,
img:"foot_chamomile.jpg",
options:[{label:"Chamomile",key:"chamomile"}],
stock:{chamomile:2}
},
{
name:"AOA Foot Peeling Mask",
price:75,
img:"foot_peeling.jpg",
options:[{label:"Peeling",key:"peeling"}],
stock:{peeling:2}
},
{
name:"AOA Rose Foot Mask",
price:65,
img:"foot_rose.jpg",
options:[{label:"Rose",key:"rose"}],
stock:{rose:2}
},
{
name:"AOA Acne Patches",
price:65,
img:"acne_patches.jpg",
options:[{label:"10mm",key:"default"}],
stock:{default:3}
},
{
name:"AOA Magical Girl Lip Stain",
price:75,
img:"lip_kuu.jpg",
options:[
{label:"Kuu",key:"kuu"},
{label:"Hime",key:"hime"}
],
stock:{kuu:1,hime:1}
},
{
name:"AOA Soft Headband",
price:45,
img:"headband_pink_ears.jpg",
options:[
{label:"Pink Ears",key:"pink"},
{label:"Purple Ears",key:"purple"}
],
stock:{pink:1,purple:1}
},
{
name:"AOA Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:[
{label:"Pink",key:"pink"},
{label:"Black",key:"black"}
],
stock:{pink:1,black:1}
}
];

let cart=[];
let total=0;

function render(){
const container=document.getElementById("products");
container.innerHTML="";

products.forEach((p,i)=>{

let opt=p.options.map(o=>
`<option value="${o.key}">${o.label}</option>`
).join("");

container.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="updateStock(${i})">
${opt}
</select>

<p id="stock${i}"></p>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

function getStock(p,k){return p.stock[k]??0;}

function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
document.getElementById("stock${i}".replace("${i}",i))=
"Stock: "+getStock(p,sel);
document.getElementById("stock"+i).innerText="Stock: "+getStock(p,sel);
}

function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if(getStock(p,sel)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

renderCart();
updateStock(i);
updateCartCount();
}

function renderCart(){
document.getElementById("cart").innerHTML=
cart.map(c=>`<li>${c.name} (${c.option}) - $${c.price}</li>`).join("");

document.getElementById("total").innerText=total;

updateCartCount();
}

function toggleCart(){
document.getElementById("cartPanel").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}

function updateCartCount(){
document.getElementById("cartCount").innerText=cart.length;
}

function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

render();

document.addEventListener("change",e=>{
if(e.target.tagName==="SELECT"){
let i=e.target.id.replace("opt","");
updateStock(i);
}
});
</script>

</body>
</html>
