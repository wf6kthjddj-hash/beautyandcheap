<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
position:sticky;top:0;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.card img{
width:100%;height:180px;object-fit:cover;border-radius:10px;
}

select,input{width:100%;padding:8px;margin-top:6px}

.cart{
position:fixed;right:0;top:0;width:340px;height:100%;
background:#fff;transform:translateX(100%);
transition:.3s;display:flex;flex-direction:column;border-left:1px solid #ddd;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}
.cartFooter{padding:10px;border-top:1px solid #ddd}

.admin{
position:fixed;left:0;top:0;width:420px;height:100%;
background:#f7f7f7;transform:translateX(-110%);
transition:.3s;padding:14px;overflow:auto;
}
.admin.open{transform:translateX(0)}

.adminCard{
background:#fff;padding:10px;margin-top:10px;border-radius:10px;border:1px solid #eee;
}

button{cursor:pointer}

</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<div>
<button onclick="show('shop')">Tienda</button>
<button onclick="show('home')">Inicio</button>
<button onclick="toggleCart()">🛒 <span id="count">0</span></button>
<button onclick="openAdmin()">Admin</button>
</div>
</header>

<!-- SHOP -->
<div id="shop" class="section active">
<div class="grid" id="products"></div>
</div>

<!-- HOME -->
<div id="home" class="section">
<h2>Inicio</h2>
<p>Bienvenida 💄</p>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="toggleCart()">Cerrar</button>
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">
Total: $<span id="total">0</span>
</div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Admin</h3>

<div id="loginBox">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="adminTools" style="display:none">

<h4>Agregar producto</h4>
<input id="pname" placeholder="Nombre">
<input id="pprice" placeholder="Precio">
<input id="pimg" placeholder="Imagen (archivo.jpg)">
<button onclick="addProduct()">Agregar</button>

<hr>

<div id="adminList"></div>

</div>

</div>

<script>

/* 🔐 ADMIN */
let logged=false;
let adminUser="admin";
let adminPass="1234";

/* 🧠 INVENTARIO CON ID (FIX CLAVE) */
let products = JSON.parse(localStorage.getItem("products")) || [
{id:1,name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{id:2,name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{id:3,name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",options:["sin aroma"],stock:{"sin aroma":5}},
{id:4,name:"AOA Retro Chic Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}}
];

let cart=[];
let total=0;

/* 🔐 LOGIN */
function login(){
if(user.value===adminUser && pass.value===adminPass){
logged=true;
document.getElementById("loginBox").style.display="none";
document.getElementById("adminTools").style.display="block";
renderAdmin();
}else{
alert("Acceso denegado");
}
}

/* 🧠 RENDER SHOP */
function render(){

let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let options=Object.keys(p.stock)
.map(o=>`<option value="${o}">${o} (${p.stock[o]})</option>`)
.join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}">
${options}
</select>

<button onclick="add(${p.id})">Agregar</button>
</div>
`;
});

renderCart();
save();
renderAdmin();
}

/* 🛒 ADD (POR ID) */
function add(id){

let p=products.find(x=>x.id===id);
let sel=document.getElementById("opt"+products.indexOf(p)).value;

if(!p.stock[sel] || p.stock[sel]<=0){
alert("Agotado");
return;
}

p.stock[sel]--;

cart.push({id:p.id,name:p.name,option:sel,price:p.price});
total+=p.price;

render();
}

/* 🧾 CART */
function renderCart(){

let box=document.getElementById("cartList");
box.innerHTML="";

cart.forEach((c,i)=>{
box.innerHTML+=`
<div>
<b>${c.name}</b> (${c.option})
<button onclick="removeItem(${i})">X</button>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;

}

/* ❌ REMOVE CART */
function removeItem(i){

let item=cart[i];
total-=item.price;

let p=products.find(x=>x.id===item.id);
if(p){
p.stock[item.option] = (p.stock[item.option]||0)+1;
}

cart.splice(i,1);
render();

}

/* ➕ ADD PRODUCT (CON IMAGEN REAL) */
function addProduct(){

products.push({
id:Date.now(),
name:pname.value,
price:+pprice.value,
img:pimg.value || "default.jpg",
options:["default"],
stock:{default:5}
});

render();

}

/* ❌ DELETE SOLO UNO (FIX REAL) */
function deleteProduct(id){
products = products.filter(p=>p.id!==id);
render();
}

/* 🧾 ADMIN LIST */
function renderAdmin(){

let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach(p=>{

box.innerHTML+=`
<div class="adminCard">
<b>${p.name}</b><br>
💲 $${p.price}

<br><br>

<button onclick="deleteProduct(${p.id})">Eliminar</button>
</div>
`;
});

}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function openAdmin(){
document.getElementById("admin").classList.add("open");
}

/* SAVE */
function save(){
localStorage.setItem("products",JSON.stringify(products));
}

render();

</script>

</body>
</html>
