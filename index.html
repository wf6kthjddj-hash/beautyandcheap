<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Arial;
background:#f6f6f8;
color:#111;
}

/* HEADER */
header{
background:#fff;
padding:16px;
text-align:center;
font-weight:600;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:15px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
font-weight:500;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
padding:20px;
}

/* PRODUCT */
.card{
background:#fff;
border-radius:14px;
padding:12px;
box-shadow:0 6px 18px rgba(0,0,0,.06);
transition:.2s;
}

.card:hover{transform:translateY(-3px)}

.card img{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
}

select{
width:100%;
margin-top:6px;
padding:8px;
border-radius:10px;
border:1px solid #ddd;
}

button.buy{
width:100%;
margin-top:10px;
padding:10px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:380px;
height:100%;
background:#fff;
border-left:1px solid #eee;
transform:translateX(100%);
transition:.3s;
z-index:9999;
display:flex;
flex-direction:column;
}

.cart.open{transform:translateX(0)}

.cartHeader{
padding:14px;
border-bottom:1px solid #eee;
font-weight:600;
}

.cartBody{
flex:1;
overflow:auto;
padding:12px;
}

.cartItem{
border:1px solid #eee;
border-radius:12px;
padding:10px;
margin-bottom:10px;
}

.cartRow{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:8px;
}

.removeBtn{
background:#111;
color:#fff;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:12px;
}

.cartFooter{
border-top:1px solid #eee;
padding:12px;
}

.checkoutBtn{
width:100%;
padding:12px;
border:none;
background:#111;
color:#fff;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.totalBox{
margin-bottom:10px;
font-weight:700;
}

/* ADMIN */
.adminBtn{
position:fixed;
left:20px;
bottom:20px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:grab;
z-index:10001;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
padding:12px;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
overflow:auto;
}

.adminPanel.open{transform:translateX(0)}

.closeAdmin{
background:none;
border:none;
color:#fff;
font-size:18px;
float:right;
cursor:pointer;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

.stock{
font-size:12px;
opacity:.7;
margin-top:4px;
}

.low{
color:#ff4d4d;
font-weight:600;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section" style="padding:20px">
<h2>✨ Beauty & Cheap Pro</h2>
<p style="opacity:.6">Tienda completa con inventario real</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">

<div class="cartHeader">🛒 Carrito</div>

<div class="cartBody" id="list"></div>

<div class="cartFooter">
<div class="totalBox">Total: $<span id="total">0</span></div>
<button class="checkoutBtn" onclick="checkout()">Pagar por WhatsApp</button>
</div>

</div>

<!-- ADMIN -->
<button class="adminBtn" id="adminBtn" onmousedown="drag(event)" onclick="login()">Admin</button>

<div class="adminPanel" id="admin">
<button class="closeAdmin" onclick="closeAdmin()">✖</button>

<h3>📦 Inventario</h3>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Agregar</button>

<hr style="opacity:.2;margin:15px 0">

<h4>Productos</h4>
<div id="adminList"></div>

</div>

<script>

/* ADMIN */
let USER="admin";
let PASS=localStorage.getItem("pass")||"1234";

/* STOCK REAL */
let products=JSON.parse(localStorage.getItem("db"))||[
{name:"Brush Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"Cuticle Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"Wipes",price:50,img:"wipes.jpg",options:["default"],stock:{default:5}},
{name:"Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"Foot Mask",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{name:"Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}}
];

let cart=[];
let total=0;

/* SAVE */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

/* RENDER PRODUCTS */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="update(i)">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

update(i);
});

renderAdmin();
}

/* STOCK */
function update(i){
let p=products[i];
let sel=document.getElementById("opt"+i)?.value || p.options[0];
let s=p.stock[sel]??0;

let el=document.getElementById("stock"+i);
if(!el) return;

el.innerHTML=s<=1?`<span class="low">Stock bajo: ${s}</span>`:`Stock: ${s}`;
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

save();
renderCart();
render();
}

/* CART */
function renderCart(){
let box=document.getElementById("list");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<h4>${i.name}</h4>
<small>${i.option}</small>

<div class="cartRow">
<span>$${i.price} x ${i.qty}</span>
<button class="removeBtn" onclick="removeItem('${i.name}','${i.option}')">Eliminar</button>
</div>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE FIX */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CHECKOUT */
function checkout(){
let msg="🛒 Pedido:%0A";
let grouped={};

cart.forEach(c=>{
let k=c.name+" "+c.option;
grouped[k]=(grouped[k]||0)+1;
});

for(let k in grouped){
msg+=`- ${k} x${grouped[k]}%0A`;
}

msg+=`%0ATotal: $${total}`;

window.open(`https://wa.me/52TU_NUMERO?text=${msg}`);
}

/* ADMIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");
if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
renderAdmin();
}
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADMIN LIST */
function renderAdmin(){
let box=document.getElementById("adminList");
if(!box) return;

box.innerHTML="";

products.forEach((p,i)=>{

let st="";
for(let k in p.stock){
st+=`${k}:${p.stock[k]} `;
}

box.innerHTML+=`
<div style="background:#1a1a1a;padding:10px;margin-bottom:8px;border-radius:8px">
<b>${p.name}</b><br>
$${p.price}<br>
${st}<br>

<button onclick="del(${i})" style="margin-top:6px;background:#ff3b3b;color:#fff;border:none;padding:6px;border-radius:6px">
Eliminar
</button>
</div>
`;
});
}

/* ADD PRODUCT */
function addProduct(){
products.push({
name:n.value,
price:+p.value,
img:i.value,
options:["default"],
stock:{default:5}
});

save();
render();
}

/* DELETE PRODUCT */
function del(i){
products.splice(i,1);
save();
render();
}

/* DRAG ADMIN */
let drag=false,ox=0,oy=0;

function drag(e){
drag=true;
let b=document.getElementById("adminBtn");
let r=b.getBoundingClientRect();

ox=e.clientX-r.left;
oy=e.clientY-r.top;

document.addEventListener("mousemove",move);
document.addEventListener("mouseup",stop);
}

function move(e){
if(!drag)return;
let b=document.getElementById("adminBtn");
b.style.left=(e.clientX-ox)+"px";
b.style.top=(e.clientY-oy)+"px";
b.style.bottom="auto";
}

function stop(){
drag=false;
document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",stop);
}

render();

</script>

</body>
</html>
