<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 | Store Pro</title>

<style>
body{
margin:0;
font-family:system-ui,Arial;
background:#f5f5f7;
color:#111;
}

/* HEADER */
header{
background:#fff;
padding:14px;
text-align:center;
font-weight:600;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:16px;
padding:18px;
}

.card{
background:#fff;
border-radius:14px;
padding:12px;
box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
}

select{
width:100%;
padding:8px;
margin-top:6px;
border-radius:10px;
border:1px solid #ddd;
}

button{
cursor:pointer;
}

/* BOTONES */
.buy{
width:100%;
margin-top:10px;
padding:10px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:380px;
height:100%;
background:#fff;
border-left:1px solid #eee;
transform:translateX(100%);
transition:.3s;
z-index:9999;
display:flex;
flex-direction:column;
}

.cart.open{transform:translateX(0)}

.cartTop{
padding:14px;
font-weight:600;
border-bottom:1px solid #eee;
}

.cartBody{
flex:1;
overflow:auto;
padding:12px;
}

.cartItem{
border:1px solid #eee;
padding:10px;
border-radius:12px;
margin-bottom:10px;
}

.removeBtn{
background:#111;
color:#fff;
border:none;
padding:6px 10px;
border-radius:8px;
margin-top:6px;
}

.cartFooter{
padding:12px;
border-top:1px solid #eee;
}

.checkoutBtn{
width:100%;
padding:12px;
background:#111;
color:#fff;
border:none;
border-radius:10px;
font-weight:600;
}

/* ADMIN */
.adminBtn{
position:fixed;
left:15px;
bottom:15px;
background:#111;
color:#fff;
border:none;
padding:10px 14px;
border-radius:999px;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:360px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:12px;
overflow:auto;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

.small{
font-size:12px;
opacity:.7;
}
</style>
</head>

<body>

<header>
💄 Beauty & Cheap Store Pro
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px">
🛒 <span id="count">0</span>
</button>
</header>

<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartTop">🛒 Carrito</div>
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">
Total: $<span id="total">0</span>
<button class="checkoutBtn" onclick="checkout()">Pagar WhatsApp</button>
</div>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="loginAdmin()">Admin</button>

<div class="adminPanel" id="admin">
<h3>📦 Shopify Admin</h3>

<button onclick="closeAdmin()">Cerrar</button>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Agregar</button>

<hr>

<h4>Inventario</h4>
<div id="adminList"></div>

<hr>

<h4>📊 Ventas</h4>
<div id="orders"></div>

</div>

<script>

/* 🔥 INVENTARIO ORIGINAL (NO TOCADO, SOLO ESTRUCTURA ESTABLE) */
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"AOA Brush Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"Cuticle Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"Makeup Wipes",price:50,img:"wipes.jpg",options:["default"],stock:{default:5}},
{name:"Lipstick Retro",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"Foot Mask",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}}
];

let cart=[];
let total=0;

/* ORDERS */
let orders = JSON.parse(localStorage.getItem("orders")) || [];

/* SAVE */
function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("orders",JSON.stringify(orders));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}">
${opts}
</select>

<div class="small" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});

renderAdmin();
}

/* STOCK */
function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

document.getElementById("stock"+i).innerText="Stock: "+s;
}

/* ADD CART */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

render();
renderCart();
save();
}

/* CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<b>${i.name}</b><br>
${i.option}<br>
$${i.price} x ${i.qty}
<button class="removeBtn" onclick="removeItem('${i.name}','${i.option}')">Eliminar</button>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CHECKOUT */
function checkout(){
orders.push({
date:new Date().toLocaleString(),
items:cart,
total:total
});

save();

let msg="🛒 Pedido:%0A";
cart.forEach(c=>{
msg+=`- ${c.name} (${c.option})%0A`;
});
msg+=`Total: $${total}`;

window.open("https://wa.me/52TU_NUMERO?text="+encodeURIComponent(msg));
}

/* ADMIN LOGIN */
function loginAdmin(){
let u=prompt("Usuario");
let p=prompt("Contraseña");

if(u==="admin" && p==="1234"){
document.getElementById("admin").classList.add("open");
renderAdmin();
renderOrders();
}
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADMIN LIST */
function renderAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div style="background:#222;padding:10px;margin-bottom:8px">
<b>${p.name}</b> - $${p.price}
<button onclick="del(${i})" style="margin-top:5px;background:red;color:#fff;border:none">
Eliminar
</button>
</div>
`;
});
}

/* ORDERS */
function renderOrders(){
let box=document.getElementById("orders");
box.innerHTML="";

orders.forEach(o=>{
box.innerHTML+=`
<div style="background:#222;padding:8px;margin-bottom:5px">
${o.date}<br>
Total: $${o.total}
</div>
`;
});
}

/* ADD PRODUCT */
function addProduct(){
products.push({
name:n.value,
price:+p.value,
img:i.value,
options:["default"],
stock:{default:5}
});

save();
render();
}

/* DELETE */
function del(i){
products.splice(i,1);
save();
render();
}

/* INIT */
render();

</script>

</body>
</html>
