<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f7f7fb;
color:#111;
}

header{
background:#fff;
padding:15px;
text-align:center;
font-weight:bold;
border-bottom:1px solid #eee;
position:sticky;
top:0;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
padding:15px;
}

.card{
background:#fff;
padding:10px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
border-radius:10px;
}

select{
width:100%;
padding:6px;
margin-top:6px;
}

button{
cursor:pointer;
}

.buy{
width:100%;
padding:10px;
margin-top:8px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
}

.stock{
font-size:12px;
opacity:.7;
margin-top:5px;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:340px;
height:100%;
background:#fff;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.3s;
display:flex;
flex-direction:column;
}

.cart.open{transform:translateX(0)}

.cartTop{
padding:12px;
font-weight:bold;
border-bottom:1px solid #eee;
}

.cartBody{
flex:1;
overflow:auto;
padding:10px;
}

.cartItem{
border:1px solid #eee;
padding:8px;
margin-bottom:8px;
border-radius:10px;
}

.removeBtn{
background:#000;
color:#fff;
border:none;
padding:5px 8px;
border-radius:6px;
margin-top:5px;
}

.cartFooter{
padding:10px;
border-top:1px solid #eee;
}

/* ADMIN */
.adminBtn{
position:fixed;
left:15px;
bottom:15px;
background:#111;
color:#fff;
border:none;
padding:10px 14px;
border-radius:999px;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:340px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-100%);
transition:.3s;
padding:10px;
overflow:auto;
}

.adminPanel.open{transform:translateX(0)}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:10px;top:10px">
🛒 <span id="count">0</span>
</button>
</header>

<div class="grid" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartTop">Carrito</div>
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">
Total: $<span id="total">0</span>
</div>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="openAdmin()">Admin</button>

<div class="adminPanel" id="admin">
<h3>Admin</h3>
<button onclick="closeAdmin()">Cerrar</button>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<button onclick="addProduct()">Agregar</button>

<hr>

<div id="adminList"></div>
</div>

<script>

/* 💄 INVENTARIO RESTAURADO CON VARIANTES (TU SISTEMA ORIGINAL) */
let products = [
{
name:"AOA Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:["black","purple"],
stock:{black:2,purple:1}
},
{
name:"AOA Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:["peach","strawberry","rose"],
stock:{peach:1,strawberry:2,rose:2}
},
{
name:"AOA Makeup Remover Wipes",
price:50,
img:"wipes.jpg",
options:["default"],
stock:{default:5}
},
{
name:"AOA Lipstick Retro Chic",
price:70,
img:"lipstick_mod.jpg",
options:["mod"],
stock:{mod:1}
},
{
name:"AOA Foot Mask Chamomile",
price:65,
img:"foot_chamomile.jpg",
options:["chamomile"],
stock:{chamomile:2}
},
{
name:"AOA Foot Peeling Mask",
price:75,
img:"foot_peeling.jpg",
options:["peeling"],
stock:{peeling:2}
},
{
name:"AOA Acne Patches 10mm",
price:65,
img:"acne_patches.jpg",
options:["10mm"],
stock:{"10mm":3}
},
{
name:"AOA Lip Stain Magical",
price:75,
img:"lip_kuu.jpg",
options:["kuu","hime"],
stock:{kuu:1,hime:1}
},
{
name:"AOA Headband Soft",
price:45,
img:"headband_pink_ears.jpg",
options:["pink","purple"],
stock:{pink:1,purple:1}
},
{
name:"AOA Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:["pink","black"],
stock:{pink:1,black:1}
}
];

let cart=[];
let total=0;

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="update(${i})">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

update(i);
});

renderAdmin();
}

/* STOCK */
function update(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

document.getElementById("stock"+i).innerText="Stock: "+s;
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

render();
renderCart();
}

/* CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<b>${i.name}</b><br>
${i.option}<br>
$${i.price} x ${i.qty}

<button class="removeBtn" onclick="removeItem('${i.name}','${i.option}')">
Eliminar
</button>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CART TOGGLE */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

/* ADMIN */
function openAdmin(){
document.getElementById("admin").classList.add("open");
renderAdmin();
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADMIN LIST */
function renderAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div style="background:#222;padding:8px;margin-bottom:8px">
<b>${p.name}</b><br>
$${p.price}

<button onclick="del(${i})" style="margin-top:5px;background:red;color:#fff;border:none;padding:6px">
Eliminar
</button>
</div>
`;
});
}

/* ADD PRODUCT */
function addProduct(){
products.push({
name:n.value,
price:+p.value,
img:"default.jpg",
options:["default"],
stock:{default:5}
});

render();
}

/* DELETE */
function del(i){
products.splice(i,1);
render();
}

render();

</script>

</body>
</html>
