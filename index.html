<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff0f5;
}

header{
  background:linear-gradient(45deg,#ff69b4,#ff1493);
  color:white;
  text-align:center;
  padding:20px;
  font-size:28px;
}

.hero{
  text-align:center;
  padding:40px;
  font-size:20px;
  animation:fade 5s infinite alternate;
}

@keyframes fade{
  from{opacity:0.5}
  to{opacity:1}
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

button{
  background:#ff1493;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.cart{
  position:fixed;
  right:0;
  top:0;
  width:250px;
  height:100%;
  background:white;
  border-left:2px solid #ccc;
  padding:10px;
  overflow:auto;
}

</style>
</head>

<body>

<header>💖 Beauty & Cheap 💖</header>

<div class="hero">
✨ Glow up todos los días ✨<br>
💄 Maquillaje bonito, precios mejores 💄
</div>

<div class="products" id="products"></div>

<div class="cart">
<h3>🛒 Carrito</h3>
<div id="cart"></div>
<h4>Total: $<span id="total">0</span></h4>
</div>

<script>

const products = [

{ name:"AOA Brush Cleaning Egg - Black", price:45, stock:1, img:"images/egg_black.jpg"},
{ name:"AOA Brush Cleaning Egg - Purple", price:45, stock:1, img:"images/egg_purple.jpg"},

{ name:"AOA Cuticle Revitalizing Pen - Peach", price:55, stock:1, img:"images/cuticle_peach.jpg"},
{ name:"AOA Cuticle Revitalizing Pen - Strawberry", price:55, stock:2, img:"images/cuticle_strawberry.jpg"},
{ name:"AOA Cuticle Revitalizing Pen - Rose", price:55, stock:2, img:"images/cuticle_rose.jpg"},

{ name:"AOA Makeup Remover Wipes - Unscented", price:50, stock:5, img:"images/wipes.jpg"},

{ name:"AOA Retro Chic Lipstick - Mod", price:70, stock:1, img:"images/lipstick_mod.jpg"},

{ name:"AOA Skin Chamomile Foot Mask", price:65, stock:2, img:"images/foot_chamomile.jpg"},
{ name:"AOA Skin Foot Peeling Mask", price:75, stock:2, img:"images/foot_peeling.jpg"},
{ name:"AOA Skin Rose Foot Mask", price:65, stock:2, img:"images/foot_rose.jpg"},

{ name:"AOA Invisible Acne Patches 10mm", price:65, stock:3, img:"images/acne_patches.jpg"},

{ name:"AOA Magical Girl Lip Stain - Kuu", price:75, stock:1, img:"images/lip_kuu.jpg"},
{ name:"AOA Magical Girl Lip Stain - Hime", price:75, stock:1, img:"images/lip_hime.jpg"},

{ name:"AOA Plush Headband - Pink Ears", price:45, stock:1, img:"images/headband_pink_ears.jpg"},
{ name:"AOA Plush Headband - Purple Ears", price:45, stock:1, img:"images/headband_purple_ears.jpg"},

{ name:"AOA Wonder Blender - Pink", price:45, stock:1, img:"images/blender_pink.jpg"},
{ name:"AOA Wonder Blender - Black", price:45, stock:1, img:"images/blender_black.jpg"}

];

let cart = [];

function renderProducts(){
  const container = document.getElementById("products");
  container.innerHTML="";

  products.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p>$${p.price}</p>
      <p>Quedan ${p.stock}</p>
      <button onclick="addToCart(${i})">Agregar</button>
    `;

    container.appendChild(div);
  });
}

function addToCart(i){
  if(products[i].stock<=0) return;

  products[i].stock--;
  cart.push(products[i]);

  renderProducts();
  renderCart();
}

function renderCart(){
  const c=document.getElementById("cart");
  const total=document.getElementById("total");

  c.innerHTML="";
  let sum=0;

  cart.forEach((p,i)=>{
    sum+=p.price;
    c.innerHTML+=`
      <p>${p.name} - $${p.price}</p>
    `;
  });

  total.innerText=sum;
}

renderProducts();

</script>

</body>
</html>
