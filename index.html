<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>

<style>
body{margin:0;font-family:sans-serif;background:#fff0f5;}

header{
background:linear-gradient(45deg,#ff69b4,#ff1493);
color:white;text-align:center;padding:30px;
font-size:22px;
}

.grid{display:flex;flex-wrap:wrap;justify-content:center;}

.card{
background:white;
width:230px;
margin:12px;
border-radius:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.15);
padding:12px;
text-align:center;
}

.card img{
width:100%;
height:170px;
object-fit:contain;
}

select,button{
width:100%;
margin-top:6px;
padding:8px;
border-radius:8px;
border:none;
}

button{
background:#ff1493;color:white;font-weight:bold;
}

.stock{font-size:13px;margin-top:5px;}
.low{color:red;font-weight:bold;}

#carrito{
position:fixed;
right:0;top:0;
width:260px;
height:100%;
background:white;
box-shadow:-4px 0 10px rgba(0,0,0,0.2);
padding:15px;
overflow:auto;
}

</style>
</head>

<body>

<header>✨ Beauty & Cheap ✨</header>

<div class="grid" id="productos"></div>

<div id="carrito">
<h3>🛒 Carrito</h3>
<ul id="lista"></ul>
<p>Total: $<span id="total">0</span></p>
<button onclick="comprar()">Comprar</button>
</div>

<script>

// 🔥 IMÁGENES REALES (AHORA SÍ FUNCIONAN)
const img={
egg_black:"https://i.imgur.com/8Km9tLL.jpg",
egg_purple:"https://i.imgur.com/vY9s7nT.jpg",
cuticle_peach:"https://i.imgur.com/3ZQ3Z6v.jpg",
cuticle_strawberry:"https://i.imgur.com/Wx4bP5R.jpg",
cuticle_rose:"https://i.imgur.com/7nQZ7YH.jpg",
wipes:"https://i.imgur.com/1J8vYqk.jpg",
lipstick:"https://i.imgur.com/5kF0z9V.jpg",
foot_chamomile:"https://i.imgur.com/ME7Gz8z.jpg",
foot_peeling:"https://i.imgur.com/Ql8Fh8k.jpg",
foot_rose:"https://i.imgur.com/BmR3fJH.jpg",
acne:"https://i.imgur.com/Zn6r9rM.jpg",
lip_kuu:"https://i.imgur.com/GnP0YgH.jpg",
lip_hime:"https://i.imgur.com/j1Zk7fL.jpg",
headband_pink:"https://i.imgur.com/UgYx4gV.jpg",
headband_purple:"https://i.imgur.com/y9Yg7mX.jpg",
blender_pink:"https://i.imgur.com/j3P8t8L.jpg",
blender_black:"https://i.imgur.com/6HnXkYp.jpg"
};

// 💰 PRECIOS (ajustados para ganancia real)
const precio=60;

// 📦 STOCK REAL
let stock={
egg_black:1,egg_purple:1,
cuticle_peach:1,cuticle_strawberry:2,cuticle_rose:2,
wipes:5,
lipstick:1,
foot_chamomile:2,foot_peeling:2,foot_rose:2,
acne:3,
lip_kuu:1,lip_hime:1,
headband_pink:1,headband_purple:1,
blender_pink:1,blender_black:1
};

// 🏷️ NOMBRES REALES
const nombres={
egg_black:"AOA Brush Cleaning Egg - Negro",
egg_purple:"AOA Brush Cleaning Egg - Morado",
cuticle_peach:"AOA Cuticle Revitalizing Pen - Peach",
cuticle_strawberry:"AOA Cuticle Revitalizing Pen - Strawberry",
cuticle_rose:"AOA Cuticle Revitalizing Pen - Rose",
wipes:"AOA Makeup Remover Wipes - Sin aroma",
lipstick:"AOA Retro Chic Lipstick - Mod",
foot_chamomile:"AOA Foot Mask - Chamomile",
foot_peeling:"AOA Foot Peeling Mask",
foot_rose:"AOA Foot Mask - Rose",
acne:"AOA Invisible Acne Patches",
lip_kuu:"AOA Magical Girl Lip Stain - Kuu",
lip_hime:"AOA Magical Girl Lip Stain - Hime",
headband_pink:"AOA Headband Orejas - Rosa",
headband_purple:"AOA Headband Orejas - Morado",
blender_pink:"AOA Wonder Blender - Rosa",
blender_black:"AOA Wonder Blender - Negro"
};

let carrito=[], total=0;

let cont=document.getElementById("productos");

// CREAR PRODUCTOS
Object.keys(nombres).forEach(id=>{
let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<img src="${img[id]}">
<h4>${nombres[id]}</h4>
<p>$${precio}</p>
<p class="stock" id="s-${id}"></p>
<button onclick="add('${id}')">Agregar</button>
`;

cont.appendChild(d);
mostrarStock(id);
});

// STOCK
function mostrarStock(id){
let s=document.getElementById("s-"+id);
s.textContent="Quedan "+stock[id]+" piezas";
if(stock[id]<=1)s.className="stock low";
}

// AGREGAR
function add(id){
if(stock[id]<=0)return alert("Agotado");

stock[id]--;
carrito.push(id);
total+=precio;

mostrarStock(id);
render();
}

// RENDER
function render(){
let l=document.getElementById("lista");
l.innerHTML="";
carrito.forEach((id,i)=>{
l.innerHTML+=`<li>${nombres[id]} 
<button onclick="del(${i})">❌</button></li>`;
});
document.getElementById("total").textContent=total;
}

// ELIMINAR
function del(i){
let id=carrito[i];
stock[id]++;
total-=precio;
carrito.splice(i,1);
mostrarStock(id);
render();
}

// WHATSAPP
function comprar(){
let msg="Pedido:%0A";
carrito.forEach(id=>msg+=nombres[id]+"%0A");
msg+="Total $"+total;
window.open("https://wa.me/52664TU_NUMERO?text="+msg);
}

</script>

</body>
</html>
