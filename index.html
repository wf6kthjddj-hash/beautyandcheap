<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{
margin:0;
font-family:system-ui,Segoe UI,Arial;
background:#f6f6f8;
color:#111;
}

header{
background:#0e0e10;
color:#fff;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
font-weight:600;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:20px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
}

/* SECCIONES */
.section{display:none;padding:20px}
.active{display:block}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

/* CARD */
.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:#fff;
padding:10px;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.3s;
z-index:9999;
}

.cart.open{transform:translateX(0)}

.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:9998;
}

.backdrop.show{
opacity:1;
visibility:visible;
}

/* ADMIN */
.adminBtn{
position:fixed;
bottom:20px;
left:20px;
background:#111;
color:#fff;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:340px;
height:100%;
background:#111;
color:#fff;
padding:12px;
overflow:auto;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

.closeAdmin{
background:none;
border:none;
color:#fff;
font-size:20px;
float:right;
cursor:pointer;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

/* CART COUNT */
#count{
background:#fff;
color:#111;
padding:2px 8px;
border-radius:20px;
font-size:12px;
margin-left:5px;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Bienvenida a Beauty & Cheap 💄</h2>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>

<div class="cart" id="cart">
<h3>🛒 Carrito</h3>
<ul id="list"></ul>
<p>Total: $<span id="total"></span></p>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="login()">Admin</button>

<div class="adminPanel" id="admin">
<button class="closeAdmin" onclick="closeAdmin()">✖</button>

<h3>Panel Admin</h3>

<h4>Contraseña</h4>
<input id="oldPass" placeholder="Actual">
<input id="newPass" placeholder="Nueva">
<button onclick="changePass()">Cambiar</button>

<hr>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Guardar</button>

<div id="list"></div>
</div>

<script>

/* PASSWORD */
let USER="admin";
let PASS=localStorage.getItem("adminPass") || "1234";

/* PRODUCTOS RESTAURADOS */
let products = JSON.parse(localStorage.getItem("db")) || [
{name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg"},
{name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg"},
{name:"AOA Makeup Remover Wipes",price:50,img:"wipes.jpg"},
{name:"AOA Retro Lipstick",price:70,img:"lipstick_mod.jpg"},
{name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg"},
{name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg"},
{name:"AOA Rose Foot Mask",price:65,img:"foot_rose.jpg"},
{name:"AOA Acne Patches",price:65,img:"acne_patches.jpg"},
{name:"AOA Lip Stain",price:75,img:"lip_kuu.jpg"},
{name:"AOA Headband",price:45,img:"headband_pink_ears.jpg"},
{name:"AOA Blender",price:45,img:"blender_pink.jpg"}
];

let cart=[];
let total=0;

/* SAVE */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<button onclick="add(${i})">Agregar</button>
</div>
`;
});
}

/* CART */
function add(i){
cart.push(products[i]);
total+=products[i].price;

renderCart();
updateCount();
}

function renderCart(){
document.getElementById("list").innerHTML=
cart.map(c=>`<li>${c.name} - $${c.price}</li>`).join("");

document.getElementById("total").innerText=total;
updateCount();
}

function updateCount(){
document.getElementById("count").innerText=cart.length;
}

/* TOGGLE CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* LOGIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");

if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
renderAdmin();
}else alert("Acceso denegado");
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* PASSWORD CHANGE */
function changePass(){
let o=document.getElementById("oldPass").value;
let n=document.getElementById("newPass").value;

if(o!==PASS) return alert("Incorrecta");

PASS=n;
localStorage.setItem("adminPass",PASS);

alert("Actualizada ✔");
}

/* ADMIN */
function renderAdmin(){
let box=document.getElementById("list");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="adminBox">
<input value="${p.name}" onchange="edit(${i},this.value)">
<input value="${p.price}" onchange="price(${i},this.value)">
<button onclick="del(${i})">Eliminar</button>
</div>
`;
});
}

function edit(i,v){products[i].name=v;save();render();}
function price(i,v){products[i].price=parseFloat(v);save();render();}
function del(i){products.splice(i,1);save();render();renderAdmin();}

function addProduct(){
let n=document.getElementById("n").value;
let p=document.getElementById("p").value;
let i=document.getElementById("i").value;

products.push({name:n,price:parseFloat(p),img:i});
save();render();renderAdmin();
}

render();

</script>

</body>
</html>
