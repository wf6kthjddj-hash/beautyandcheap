<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Arial;
background:#f7f7fb;
color:#111;
}

/* HEADER */
header{
background:#0d0d10;
color:#fff;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
font-weight:600;
letter-spacing:.3px;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:20px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
font-weight:500;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
padding:20px;
}

/* CARD (Sephora style limpio) */
.card{
background:#fff;
border-radius:14px;
padding:12px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
}

select{
width:100%;
margin-top:6px;
padding:8px;
border-radius:10px;
border:1px solid #ddd;
}

button.buy{
width:100%;
margin-top:10px;
padding:10px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:360px;
height:100%;
background:rgba(255,255,255,.98);
backdrop-filter:blur(12px);
padding:14px;
overflow:auto;
transform:translateX(100%);
transition:.3s;
z-index:9999;
border-left:1px solid #eee;
}

.cart.open{transform:translateX(0)}

.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:9998;
}

.backdrop.show{
opacity:1;
visibility:visible;
}

/* CART ITEMS */
.cartItem{
background:#fff;
border:1px solid #eee;
border-radius:12px;
padding:10px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.cartItem h4{
margin:0;
font-size:14px;
}

.cartRow{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:8px;
}

.removeBtn{
background:#111;
color:#fff;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:12px;
}

.totalBox{
margin-top:15px;
padding-top:10px;
border-top:1px solid #eee;
font-weight:700;
}

.checkoutBtn{
width:100%;
margin-top:12px;
padding:12px;
border:none;
background:linear-gradient(135deg,#111,#333);
color:#fff;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

/* ADMIN BUTTON */
.adminBtn{
position:fixed;
left:20px;
bottom:20px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:grab;
z-index:10001;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

/* ADMIN PANEL */
.adminPanel{
position:fixed;
left:0;
top:0;
width:360px;
height:100%;
background:#111;
color:#fff;
padding:12px;
overflow:auto;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

.closeAdmin{
background:none;
border:none;
color:#fff;
font-size:20px;
float:right;
cursor:pointer;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

/* STOCK */
.stock{
font-size:12px;
opacity:.7;
margin-top:4px;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active" style="padding:20px">
<h2>✨ Beauty & Cheap 💄</h2>
<p style="opacity:.7">Glow real, prices low.</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>

<div class="cart" id="cart">
<h3>🛒 Carrito</h3>
<div id="list"></div>

<div class="totalBox">
Total: $<span id="total">0</span>
</div>

<button class="checkoutBtn" onclick="checkoutWhatsApp()">
Pagar por WhatsApp 💬
</button>
</div>

<!-- ADMIN -->
<button class="adminBtn" id="adminBtn" onmousedown="dragStart(event)" onclick="login()">
Admin
</button>

<div class="adminPanel" id="admin">
<button class="closeAdmin" onclick="closeAdmin()">✖</button>

<h3>Panel Admin</h3>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Guardar</button>

</div>

<script>

/* ADMIN */
let USER="admin";
let PASS=localStorage.getItem("adminPass") || "1234";

/* 🧠 STOCK REAL COMPLETO */
let products = JSON.parse(localStorage.getItem("db")) || [

{
name:"Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:["black","purple"],
stock:{black:2,purple:1}
},
{
name:"Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:["peach","strawberry","rose"],
stock:{peach:1,strawberry:2,rose:2}
},
{
name:"Makeup Remover Wipes",
price:50,
img:"wipes.jpg",
options:["default"],
stock:{default:5}
},
{
name:"Retro Lipstick",
price:70,
img:"lipstick_mod.jpg",
options:["mod"],
stock:{mod:1}
},
{
name:"Foot Mask Chamomile",
price:65,
img:"foot_chamomile.jpg",
options:["chamomile"],
stock:{chamomile:2}
},
{
name:"Foot Peeling Mask",
price:75,
img:"foot_peeling.jpg",
options:["peeling"],
stock:{peeling:2}
},
{
name:"Rose Foot Mask",
price:65,
img:"foot_rose.jpg",
options:["rose"],
stock:{rose:2}
},
{
name:"Acne Patches",
price:65,
img:"acne_patches.jpg",
options:["10mm"],
stock:{"10mm":3}
},
{
name:"Magical Lip Stain",
price:75,
img:"lip_kuu.jpg",
options:["kuu","hime"],
stock:{kuu:1,hime:1}
},
{
name:"Headband",
price:45,
img:"headband_pink_ears.jpg",
options:["pink","purple"],
stock:{pink:1,purple:1}
},
{
name:"Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:["pink","black"],
stock:{pink:1,black:1}
}

];

let cart=[];
let total=0;

/* SAVE */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="updateStock(${i})">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

/* STOCK REAL */
function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

document.getElementById("stock"+i).innerText=
s>0 ? "Stock: "+s : "AGOTADO";
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

renderCart();
updateStock(i);
updateCount();
save();
}

/* CART */
function renderCart(){

let box=document.getElementById("list");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let key=c.name+"-"+c.option;
if(!grouped[key]){
grouped[key]={...c,qty:1};
}else grouped[key].qty++;
});

Object.values(grouped).forEach(item=>{
box.innerHTML+=`
<div class="cartItem">
<h4>${item.name}</h4>
<small>${item.option}</small>

<div class="cartRow">
<span>$${item.price} x ${item.qty}</span>
<button class="removeBtn" onclick="removeItem('${item.name}','${item.option}')">Eliminar</button>
</div>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CHECKOUT */
function checkoutWhatsApp(){
let msg="🛒 Pedido Beauty & Cheap:%0A";
let grouped={};

cart.forEach(c=>{
let k=c.name+" "+c.option;
grouped[k]=(grouped[k]||0)+1;
});

for(let k in grouped){
msg+=`- ${k} x${grouped[k]}%0A`;
}

msg+=`%0ATotal: $${total}`;

let phone="52TU_NUMERO";

window.open(`https://wa.me/${phone}?text=${msg}`);
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}

/* ADMIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");
if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
}
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADD PRODUCT */
function addProduct(){
let n=document.getElementById("n").value;
let p=parseFloat(document.getElementById("p").value);
let i=document.getElementById("i").value;

products.push({
name:n,
price:p,
img:i,
options:["default"],
stock:{default:5}
});

save();
render();
}

/* DRAG ADMIN */
let drag=false,ox=0,oy=0;

function dragStart(e){
drag=true;
let b=document.getElementById("adminBtn");
let r=b.getBoundingClientRect();

ox=e.clientX-r.left;
oy=e.clientY-r.top;

document.addEventListener("mousemove",move);
document.addEventListener("mouseup",end);
}

function move(e){
if(!drag)return;

let b=document.getElementById("adminBtn");
b.style.left=(e.clientX-ox)+"px";
b.style.top=(e.clientY-oy)+"px";
b.style.bottom="auto";
}

function end(){
drag=false;
document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",end);
}

/* INIT */
render();

</script>

</body>
</html>
