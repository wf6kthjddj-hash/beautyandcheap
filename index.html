<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty and Cheap</title>

<style>
body { font-family: Arial; margin:0; }
nav { background:#000; padding:10px; text-align:center; }
nav button { color:white; background:none; border:none; margin:10px; font-size:16px; cursor:pointer; }

.seccion { display:none; padding:20px; }
.activa { display:block; }

.producto { border:1px solid #ccc; padding:10px; margin:10px; width:200px; display:inline-block; }
.producto img { width:100%; height:150px; object-fit:cover; }

button { padding:8px; cursor:pointer; margin-top:5px; }
</style>
</head>

<body>

<nav>
  <button onclick="mostrar('inicio')">Inicio</button>
  <button onclick="mostrar('productos')">Productos</button>
  <button onclick="mostrar('carrito')">Carrito (<span id="contador">0</span>)</button>
</nav>

<div id="inicio" class="seccion activa">
  <h1>Beauty and Cheap 💄</h1>
  <p>Compra inteligente. Vende con estilo 😉</p>
</div>

<div id="productos" class="seccion">

<h2>Productos</h2>

<!-- PRODUCTOS -->

<div class="producto">
<img src="https://source.unsplash.com/200x200/?makeup,brush">
<p>Brush Cleaning Egg - $55</p>
<button onclick="agregar('Brush Cleaning Egg',55)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?lipstick">
<p>Retro Lipstick - $65</p>
<button onclick="agregar('Lipstick',65)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?lip,tint">
<p>Lip Stain - $70</p>
<button onclick="agregar('Lip Stain',70)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?nails,oil">
<p>Cuticle Oil - $55</p>
<button onclick="agregar('Cuticle Oil',55)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?face,mask">
<p>Foot Mask - $65</p>
<button onclick="agregar('Foot Mask',65)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?skincare">
<p>Acne Patches - $60</p>
<button onclick="agregar('Acne Patches',60)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?makeup,sponge">
<p>Beauty Blender - $45</p>
<button onclick="agregar('Blender',45)">Agregar</button>
</div>

<div class="producto">
<img src="https://source.unsplash.com/200x200/?spa,headband">
<p>Headband - $70</p>
<button onclick="agregar('Headband',70)">Agregar</button>
</div>

</div>

<div id="carrito" class="seccion">
<h2>Tu carrito 🛒</h2>
<ul id="lista"></ul>
<p>Total: $<span id="total">0</span></p>
<button onclick="vaciar()">Vaciar carrito</button>
</div>

<script>

let carrito = [];
let total = 0;

function mostrar(seccion) {
  document.querySelectorAll('.seccion').forEach(div => {
    div.classList.remove('activa');
  });
  document.getElementById(seccion).classList.add('activa');
}

function agregar(nombre, precio) {
  carrito.push({nombre, precio});
  total += precio;
  actualizar();
}

function eliminar(index) {
  total -= carrito[index].precio;
  carrito.splice(index,1);
  actualizar();
}

function vaciar() {
  carrito = [];
  total = 0;
  actualizar();
}

function actualizar() {
  document.getElementById("contador").textContent = carrito.length;
  document.getElementById("total").textContent = total;

  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  carrito.forEach((item, index) => {
    let li = document.createElement("li");
    li.innerHTML = item.nombre + " - $" + item.precio + 
    ` <button onclick="eliminar(${index})">❌</button>`;
    lista.appendChild(li);
  });
}

</script>

</body>
</html>
