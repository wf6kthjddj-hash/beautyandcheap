<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty and Cheap</title>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }

nav { background:#000; padding:12px; text-align:center; }
nav button { color:white; background:none; border:none; margin:10px; font-size:16px; }

.grid { display:flex; flex-wrap:wrap; justify-content:center; }

.producto {
  background:white;
  border-radius:12px;
  padding:15px;
  margin:12px;
  width:220px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.producto img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

.stock { font-size:13px; margin-top:5px; }
.low { color:red; font-weight:bold; }

button {
  background:#000;
  color:white;
  border:none;
  padding:8px;
  width:100%;
  margin-top:8px;
  border-radius:6px;
}

select { width:100%; padding:6px; margin-top:5px; }

</style>
</head>

<body>

<nav>
<button onclick="ver('productos')">Productos</button>
<button onclick="ver('carrito')">Carrito (<span id="count">0</span>)</button>
</nav>

<div id="productos" class="grid"></div>

<div id="carrito" style="display:none; padding:20px;">
<h2>Carrito</h2>
<ul id="lista"></ul>
<p>Total: $<span id="total">0</span></p>
<button onclick="comprar()">Comprar por WhatsApp</button>
</div>

<script>

// STOCK
let stock = {
cuticle:{peach:1, strawberry:2, rose:2},
blender:{pink:1, black:1},
headband:{pink:1, purple:1},
lip:{kuu:1, hime:1},
egg:{black:1, purple:1},
wipes:5,
foot:{chamomile:2, rose:2, peeling:2},
acne:3,
lipstick:1
};

let carrito = [];
let total = 0;

// PRODUCTOS
let productos = [

{nombre:"Cuticle Oil", precio:55, tipo:"cuticle",
opciones:["peach","strawberry","rose"]},

{nombre:"Wonder Blender", precio:45, tipo:"blender",
opciones:["pink","black"]},

{nombre:"Headband Orejitas", precio:70, tipo:"headband",
opciones:["pink","purple"]},

{nombre:"Lip Stain", precio:70, tipo:"lip",
opciones:["kuu","hime"]},

{nombre:"Brush Cleaner", precio:55, tipo:"egg",
opciones:["black","purple"]},

{nombre:"Foot Mask", precio:70, tipo:"foot",
opciones:["chamomile","rose","peeling"]},

{nombre:"Wipes", precio:65, tipo:"wipes"},

{nombre:"Acne Patch", precio:60, tipo:"acne"},

{nombre:"Lipstick Mod", precio:65, tipo:"lipstick"}

];

// GENERAR TIENDA
let cont = document.getElementById("productos");

productos.forEach(p=>{

let div = document.createElement("div");
div.className="producto";

let img = `<img id="img-${p.tipo}" src="img/${p.tipo}-${p.opciones ? p.opciones[0] : ''}.jpg">`;

let select = "";

if(p.opciones){
select = `<select onchange="cambiar('${p.tipo}')">` +
p.opciones.map(o=>`<option value="${o}">${o}</option>`).join("") +
`</select>`;
}

div.innerHTML = `
${img}
<p>${p.nombre} - $${p.precio}</p>
${select}
<p id="stock-${p.tipo}" class="stock"></p>
<button onclick="add('${p.tipo}',${p.precio})">Agregar</button>
`;

cont.appendChild(div);

});

// CAMBIAR IMAGEN
function cambiar(tipo){
let sel = document.querySelector(`#img-${tipo}`);
let val = event.target.value;
sel.src = `img/${tipo}-${val}.jpg`;
}

// AGREGAR
function add(tipo,precio){

let variante = null;
let s = document.querySelector(`#productos select[onchange*="${tipo}"]`);
if(s) variante = s.value;

if(typeof stock[tipo] === "object"){
if(stock[tipo][variante] <= 0) return alert("Agotado");
stock[tipo][variante]--;
}else{
if(stock[tipo] <= 0) return alert("Agotado");
stock[tipo]--;
}

carrito.push({tipo,variante,precio});
total += precio;

render();
}

// RENDER
function render(){
document.getElementById("count").textContent = carrito.length;
document.getElementById("total").textContent = total;

let lista = document.getElementById("lista");
lista.innerHTML="";

carrito.forEach((p,i)=>{
let li = document.createElement("li");
li.innerHTML = `${p.tipo} ${p.variante || ""} - $${p.precio}
<button onclick="del(${i})">❌</button>`;
lista.appendChild(li);
});

mostrarStock();
}

// ELIMINAR
function del(i){
let p = carrito[i];

if(typeof stock[p.tipo] === "object"){
stock[p.tipo][p.variante]++;
}else{
stock[p.tipo]++;
}

total -= p.precio;
carrito.splice(i,1);
render();
}

// STOCK UI
function mostrarStock(){

Object.keys(stock).forEach(tipo=>{
let el = document.getElementById("stock-"+tipo);
if(!el) return;

if(typeof stock[tipo] === "object"){
let txt = Object.entries(stock[tipo])
.map(([k,v])=>`${k}:${v}`).join(" | ");
el.innerHTML = txt;
}else{
el.innerHTML = "Disponibles: "+stock[tipo];
}
});
}

// WHATSAPP
function comprar(){
let msg="Pedido:%0A";
carrito.forEach(p=>{
msg+=`- ${p.tipo} ${p.variante || ""} $${p.precio}%0A`;
});
msg+=`Total: $${total}`;
window.open("https://wa.me/52664TU_NUMERO?text="+msg);
}

// CAMBIAR VISTA
function ver(sec){
document.getElementById("productos").style.display = sec==="productos"?"flex":"none";
document.getElementById("carrito").style.display = sec==="carrito"?"block":"none";
}

mostrarStock();

</script>

</body>
</html>
