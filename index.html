<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:#f4f4f7;
}

header{
background:#fff;
padding:14px 20px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
position:sticky;
top:0;
}

.brand{font-weight:800}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#fff;
padding:14px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:12px;
}

select,input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:10px;
border:1px solid #ddd;
}

button{
cursor:pointer;
}

.buy{
background:#111;
color:#fff;
padding:10px;
border:none;
border-radius:10px;
margin-top:10px;
width:100%;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:360px;
height:100%;
background:#fff;
transform:translateX(100%);
transition:.3s;
border-left:1px solid #eee;
display:flex;
flex-direction:column;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}
.cartFooter{padding:10px;border-top:1px solid #eee;font-weight:700}

/* ADMIN */
.admin{
position:fixed;
left:0;
top:0;
width:420px;
height:100%;
background:#f7f7f8;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
}

.admin.open{transform:translateX(0)}

.adminCard{
background:#fff;
padding:10px;
border-radius:10px;
margin-top:10px;
border:1px solid #eee;
}

.closeBtn{
position:absolute;
right:10px;
top:10px;
width:30px;
height:30px;
border-radius:50%;
border:none;
background:#000;
color:#fff;
cursor:pointer;
}

.authBox{
margin-bottom:10px;
padding:10px;
background:#fff;
border-radius:10px;
border:1px solid #ddd;
}
</style>
</head>

<body>

<header>
<div class="brand">💄 Beauty & Cheap</div>

<div>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
<button onclick="toggleCart()">🛒 <span id="count">0</span></button>
<button onclick="openAdmin()">Admin</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>📊 Dashboard</h2>
<p id="summary"></p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">
Total: $<span id="total">0</span>
</div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<button class="closeBtn" onclick="toggleAdmin()">✕</button>

<h3>Panel Admin</h3>

<div class="authBox">
<input id="user" placeholder="Usuario">
<input id="pass" placeholder="Contraseña" type="password">
<button onclick="login()">Entrar</button>
</div>

<div id="adminPanel" style="display:none">

<h4>🔧 Seguridad</h4>
<input id="newUser" placeholder="Nuevo usuario">
<input id="newPass" placeholder="Nueva contraseña">
<button onclick="changeAuth()">Cambiar credenciales</button>

<h4>📦 Productos</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<button onclick="addProduct()">Agregar / Aumentar stock</button>

<div id="adminList"></div>

</div>
</div>

<script>

/* 🔐 AUTH */
let authUser = "admin";
let authPass = "1234";
let logged = false;

/* 🧠 INVENTARIO (NO TOCADO) */
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",options:["sin aroma"],stock:{"sin aroma":5}},
{name:"AOA Retro Chic Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}},
{name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",options:["10mm"],stock:{"10mm":3}},
{name:"AOA Magical Lip Stain",price:75,img:"lip_kuu.jpg",options:["kuu","hime"],stock:{kuu:1,hime:1}},
{name:"AOA Headband Soft",price:45,img:"headband_pink_ears.jpg",options:["pink","purple"],stock:{pink:1,purple:1}},
{name:"AOA Wonder Blender",price:45,img:"blender_pink.jpg",options:["pink","black"],stock:{pink:1,black:1}}
];

let cart=[];
let total=0;

/* 🔐 LOGIN */
function login(){
if(user.value===authUser && pass.value===authPass){
logged = true;
document.getElementById("adminPanel").style.display="block";
}else{
alert("Acceso denegado");
}
}

/* 🔁 CAMBIAR USUARIO/PASS */
function changeAuth(){
authUser = newUser.value;
authPass = newPass.value;
alert("Credenciales actualizadas");
}

/* 💾 SAVE */
function save(){
localStorage.setItem("products",JSON.stringify(products));
}

/* 🧼 RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
let opts=p.options.map(o=>`<option>${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}">
${opts}
</select>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;
});

renderAdmin();
updateSummary();
save();
}

/* 🛒 ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]||0)<=0) return alert("Agotado");

p.stock[sel]--;
cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

render();
renderCart();
save();
}

/* 🧾 CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

cart.forEach(c=>{
box.innerHTML+=`
<div>
<b>${c.name}</b> - ${c.option}
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* 💼 ADMIN */
function openAdmin(){
if(!logged){
alert("Debes iniciar sesión");
return;
}
toggleAdmin();
}

/* ADMIN RENDER */
function renderAdmin(){
if(!logged) return;

let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach((p,i)=>{

let variants = Object.keys(p.stock).map(v=>`
<button onclick="removeVariant(${i},'${v}')">
❌ ${v} (${p.stock[v]})
</button>
`).join("");

box.innerHTML+=`
<div class="adminCard">
<b>${p.name}</b><br>

${variants}

<button onclick="addStock(${i})">+ Stock</button>
<button onclick="deleteProduct(${i})">Eliminar producto</button>
</div>
`;
});
}

/* ➕ STOCK */
function addStock(i){
Object.keys(products[i].stock).forEach(k=>{
products[i].stock[k]++;
});
render();
}

/* 🗑️ PRODUCT */
function deleteProduct(i){
cart = cart.filter(c=>c.name!==products[i].name);
products.splice(i,1);
save();
render();
renderCart();
}

/* 🗑️ VARIANT */
function removeVariant(i,v){
delete products[i].stock[v];

cart = cart.filter(c=>!(c.name===products[i].name && c.option===v));

if(Object.keys(products[i].stock).length===0){
products.splice(i,1);
}

save();
render();
renderCart();
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function toggleAdmin(){
document.getElementById("admin").classList.toggle("open");
}

/* DASHBOARD */
function updateSummary(){
let stock=0;
products.forEach(p=>{
Object.values(p.stock).forEach(s=>stock+=s);
});

document.getElementById("summary").innerHTML=`
📦 Productos: ${products.length}<br>
📊 Stock total: ${stock}<br>
🔐 Admin: ${logged ? "Activo" : "Bloqueado"}
`;
}

render();

</script>

</body>
</html>
