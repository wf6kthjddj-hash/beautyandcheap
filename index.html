<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:#f4f4f7;
color:#111;
}

header{
background:rgba(255,255,255,.92);
backdrop-filter:blur(12px);
padding:16px 22px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
position:sticky;
top:0;
z-index:1000;
}

.brand{font-weight:800}

.nav{display:flex;gap:14px;align-items:center}
.nav button{background:none;border:none;cursor:pointer;font-weight:500}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:24px;
max-width:1200px;
margin:auto;
}

.card{
background:#fff;
border-radius:18px;
padding:14px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
border:1px solid #eee;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:14px;
}

select,input{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
margin-top:6px;
}

.buy{
width:100%;
margin-top:10px;
padding:11px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.stock{font-size:12px;opacity:.6;margin-top:5px}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:360px;
height:100%;
background:#fff;
border-left:1px solid #eee;
transform:translateX(100%);
transition:.3s;
display:flex;
flex-direction:column;
z-index:9999;
}
.cart.open{transform:translateX(0)}

.cartTop{
padding:16px;
font-weight:700;
border-bottom:1px solid #eee;
position:relative;
}

.cartBody{flex:1;overflow:auto;padding:14px}

.cartItem{
border:1px solid #eee;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.cartFooter{
padding:14px;
border-top:1px solid #eee;
font-weight:700;
}

/* ADMIN */
.adminBtn{
position:fixed;
left:18px;
bottom:18px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:pointer;
z-index:10000;
}

.admin{
position:fixed;
left:0;
top:0;
width:420px;
height:100%;
background:#f7f7f8;
transform:translateX(-110%);
transition:.3s;
padding:16px;
overflow:auto;
z-index:10000;
border-right:1px solid #ddd;
}
.admin.open{transform:translateX(0)}

.adminHeader{
background:#111;
color:#fff;
padding:14px;
border-radius:10px;
font-weight:700;
margin-bottom:10px;
}

.adminCard{
background:#fff;
border:1px solid #e5e5e5;
border-radius:12px;
padding:12px;
margin-top:10px;
}

.admin button{
background:#d60000;
color:#fff;
border:none;
padding:8px 10px;
border-radius:8px;
cursor:pointer;
margin-top:6px;
}

.closeBtn{
position:absolute;
right:10px;
top:10px;
width:30px;
height:30px;
border-radius:50%;
border:none;
background:#000;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="brand">💄 Beauty & Cheap</div>

<div class="nav">
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
<button onclick="toggleCart()">🛒 <span id="count">0</span></button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>💄 Tienda profesional con inventario real</h2>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartTop">
🛒 Carrito
<button class="closeBtn" onclick="toggleCart()">✕</button>
</div>

<div class="cartBody" id="cartList"></div>

<div class="cartFooter">
Total: $<span id="total">0</span>
</div>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="toggleAdmin()">Admin</button>

<div class="admin" id="admin">

<div class="adminHeader">
🍔 Panel Admin
<button class="closeBtn" onclick="toggleAdmin()" style="top:10px;right:10px;">✕</button>
</div>

<input id="n" placeholder="Nombre producto">
<input id="p" placeholder="Precio (si es nuevo)">
<button onclick="addProduct()">Procesar</button>

<div id="adminList"></div>
</div>

<script>

/* 🔥 CARGAR INVENTARIO DESDE MEMORIA */
let products = JSON.parse(localStorage.getItem("products")) || [
{name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",options:["sin aroma"],stock:{"sin aroma":5}},
{name:"AOA Retro Chic Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}},
{name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",options:["10mm"],stock:{"10mm":3}},
{name:"AOA Magical Lip Stain",price:75,img:"lip_kuu.jpg",options:["kuu","hime"],stock:{kuu:1,hime:1}},
{name:"AOA Headband Soft",price:45,img:"headband_pink_ears.jpg",options:["pink","purple"],stock:{pink:1,purple:1}},
{name:"AOA Wonder Blender",price:45,img:"blender_pink.jpg",options:["pink","black"],stock:{pink:1,black:1}}
];

let cart=[];
let total=0;

/* 💾 GUARDAR */
function save(){
localStorage.setItem("products",JSON.stringify(products));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="update(${i})">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;
});

products.forEach((_,i)=>update(i));
renderAdmin();
save();
}

/* STOCK */
function update(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
if(!sel) sel=p.options[0];
document.getElementById("stock"+i).innerText="Stock: "+(p.stock[sel]??0);
}

/* ADD CART */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;
cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

render();
renderCart();
save();
}

/* CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<b>${i.name}</b><br>
${i.option}<br>
$${i.price} x ${i.qty}
</div>
`;
});

document.getElementById("total").innerText=total.toFixed(2);
document.getElementById("count").innerText=cart.length;
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
document.getElementById("admin").classList.remove("open");
}

/* ADMIN */
function toggleAdmin(){
document.getElementById("admin").classList.toggle("open");
document.getElementById("cart").classList.remove("open");
renderAdmin();
}

/* ADMIN */
function renderAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="adminCard">
<b>${p.name}</b><br>
Stock: ${Object.entries(p.stock).map(s=>s[0]+": "+s[1]).join(" | ")}
<br>
<button onclick="addStock(${i})">+ Stock</button>
</div>
`;
});
}

/* ➕ STOCK REAL */
function addStock(i){
let p=products[i];
let key=Object.keys(p.stock)[0];
p.stock[key]=(p.stock[key]||0)+1;
render();
}

/* 🔥 BUSCAR Y AGREGAR POR NOMBRE */
function addProduct(){
if(!n.value) return alert("Escribe nombre");

let name=n.value.trim();
let price=+p.value||0;

/* búsqueda inteligente */
let found=products.find(x =>
x.name.toLowerCase().includes(name.toLowerCase())
);

if(found){
let key=Object.keys(found.stock)[0];
found.stock[key]=(found.stock[key]||0)+1;
}else{
products.push({
name:name,
price:price,
img:"default.jpg",
options:["default"],
stock:{default:5}
});
}

n.value="";
p.value="";
render();
save();
}

render();

</script>

</body>
</html>
