<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty Luxe Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f6f6f8;
color:#111;
}

/* HEADER */
header{
background:#111;
color:#fff;
padding:18px;
text-align:center;
font-size:22px;
position:sticky;
top:0;
z-index:1000;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:15px;
background:#1c1c1c;
padding:10px;
}

nav button{
background:none;
border:none;
color:#fff;
cursor:pointer;
font-size:15px;
}

/* SECTIONS */
.section{display:none;padding:20px}
.active{display:block}

/* PRODUCTS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.card{
background:#fff;
border-radius:14px;
padding:12px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
transition:0.2s;
}

.card:hover{transform:scale(1.02)}

.card img{
width:100%;
height:190px;
object-fit:cover;
border-radius:12px;
}

select, button{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:1px solid #ddd;
}

button{
cursor:pointer;
font-weight:bold;
}

.buy{
background:#111;
color:#fff;
border:none;
}

/* CART PANEL */
.cart{
position:fixed;
right:0;
top:0;
width:340px;
height:100%;
background:#fff;
box-shadow:-5px 0 20px rgba(0,0,0,.15);
transform:translateX(100%);
transition:0.3s;
z-index:2000;
padding:15px;
overflow:auto;
}

.cart.open{transform:translateX(0)}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-header button{
width:auto;
background:none;
border:none;
font-size:20px;
cursor:pointer;
}

.item{
border-bottom:1px solid #eee;
padding:10px 0;
}

.qty{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:5px;
}

.qty button{
width:30px;
height:30px;
border-radius:6px;
}

.checkout{
background:#111;
color:#fff;
margin-top:10px;
}

.paybox{
background:#f3f3f3;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
Beauty Luxe 💄
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Belleza premium sin precio premium ✨</h2>
<p>Todo lo que necesitas para verte increíble 💋</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cart-header">
<h3>🛒 Carrito</h3>
<button onclick="toggleCart()">✖</button>
</div>

<div id="cartItems"></div>

<div class="paybox">
<p>Total: $<span id="total">0</span></p>

<button class="checkout" onclick="fakePay()">💳 Simular pago</button>
<button class="checkout" onclick="sendWhatsApp()">📲 Pedir por WhatsApp</button>
</div>
</div>

<script>

/* 🔥 CAMBIA SOLO ESTE NÚMERO */
const WHATSAPP = "521XXXXXXXXXX";

const products=[
{
name:"Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:[
{label:"Black",key:"black"},
{label:"Purple",key:"purple"}
],
stock:{black:1,purple:1}
},

{
name:"Cuticle Pen",
price:55,
img:"cuticle_peach.jpg",
options:[
{label:"Peach",key:"peach"},
{label:"Strawberry",key:"strawberry"},
{label:"Rose",key:"rose"}
],
stock:{peach:1,strawberry:2,rose:2}
},

{
name:"Makeup Wipes",
price:50,
img:"wipes.jpg",
options:[{label:"Único",key:"default"}],
stock:{default:5}
},

{
name:"Lipstick",
price:70,
img:"lipstick_mod.jpg",
options:[{label:"Mod",key:"mod"}],
stock:{mod:1}
},

{
name:"Foot Mask",
price:65,
img:"foot_chamomile.jpg",
options:[{label:"Chamomile",key:"chamomile"}],
stock:{chamomile:2}
},

{
name:"Acne Patches",
price:65,
img:"acne_patches.jpg",
options:[{label:"10mm",key:"default"}],
stock:{default:3}
}
];

let cart=[];

function render(){
const box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opt=p.options.map(o=>
`<option value="${o.key}">${o.label}</option>`
).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}">${opt}</select>

<p id="stock${i}"></p>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

function getStock(p,key){
return p.stock[key] ?? 0;
}

function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
document.getElementById("stock"+i).innerText=
"Stock: "+getStock(p,sel);
}

function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if(getStock(p,sel)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;

let found=cart.find(c=>c.name===p.name && c.option===sel);

if(found){
found.qty++;
}else{
cart.push({
name:p.name,
option:sel,
price:p.price,
qty:1
});
}

renderCart();
updateStock(i);
}

function renderCart(){
let box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;

cart.forEach((c,i)=>{
total+=c.price*c.qty;

box.innerHTML+=`
<div class="item">
<b>${c.name}</b> (${c.option})<br>
$${c.price}

<div class="qty">
<button onclick="minus(${i})">-</button>
<span>${c.qty}</span>
<button onclick="plus(${i})">+</button>
<button onclick="removeItem(${i})">❌</button>
</div>
</div>
`;
});

document.getElementById("total").innerText=total;
}

function plus(i){
cart[i].qty++;
renderCart();
}

function minus(i){
cart[i].qty--;
if(cart[i].qty<=0) cart.splice(i,1);
renderCart();
}

function removeItem(i){
cart.splice(i,1);
renderCart();
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

/* 💳 SIMULACIÓN DE PAGO */
function fakePay(){
alert("💳 Pago aprobado (simulado)\nGracias por tu compra ✨");
cart=[];
renderCart();
}

/* 📲 WHATSAPP CHECKOUT */
function sendWhatsApp(){

let msg="Hola! quiero pedir:%0A";

cart.forEach(c=>{
msg+=`- ${c.name} (${c.option}) x${c.qty}%0A`;
});

msg+=`Total: $${document.getElementById("total").innerText}`;

window.open(`https://wa.me/${WHATSAPP}?text=${msg}`);
}

function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

render();

document.addEventListener("change",e=>{
if(e.target.tagName==="SELECT"){
let i=e.target.id.replace("opt","");
updateStock(i);
}
});

function plus(i){cart[i].qty++;renderCart();}
function minus(i){cart[i].qty=Math.max(1,cart[i].qty-1);renderCart();}

</script>

</body>
</html>
