<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty System 💄</title>

<style>
body{
margin:0;
font-family:system-ui,Segoe UI,Arial;
background:#f6f6f8;
color:#111;
}

header{
background:#0e0e10;
color:#fff;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

nav{
display:flex;
justify-content:center;
gap:20px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
}

.section{display:none;padding:20px}
.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button.buy{
width:100%;
padding:10px;
margin-top:10px;
border:none;
background:#111;
color:#fff;
border-radius:10px;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:#fff;
padding:10px;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.3s;
z-index:9999;
}

.cart.open{transform:translateX(0)}

.backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:9998;
}

.backdrop.show{
opacity:1;
visibility:visible;
}

/* ADMIN */
.adminBtn{
position:fixed;
bottom:20px;
left:20px;
background:#111;
color:#fff;
border:none;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

.adminPanel{
position:fixed;
left:0;
top:0;
width:340px;
height:100%;
background:#111;
color:#fff;
padding:12px;
overflow:auto;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
}

.adminPanel.open{transform:translateX(0)}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

.adminBox{
background:#1c1c1c;
padding:10px;
margin-top:10px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
Beauty System 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Tienda ✨</h2>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="backdrop" id="backdrop" onclick="toggleCart()"></div>

<div class="cart" id="cart">
<h3>🛒 Carrito</h3>
<ul id="list"></ul>
<p>Total: $<span id="total"></span></p>
</div>

<!-- ADMIN -->
<button class="adminBtn" onclick="login()">Admin</button>

<div class="adminPanel" id="admin">
<h3>🔐 Admin Panel</h3>

<h4>Cambiar contraseña</h4>
<input id="oldPass" placeholder="Contraseña actual">
<input id="newPass" placeholder="Nueva contraseña">
<button onclick="changePass()">Actualizar</button>

<hr>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Guardar</button>

<div id="list"></div>
</div>

<script>

/* 🔐 PASSWORD DINÁMICA */
let USER="admin";
let PASS=localStorage.getItem("adminPass") || "1234";

function savePass(){
localStorage.setItem("adminPass",PASS);
}

/* DB */
let products=JSON.parse(localStorage.getItem("db")) || [
{name:"Brush Egg",price:45,img:"egg.jpg"},
{name:"Lipstick",price:70,img:"lip.jpg"}
];

let cart=[];
let total=0;

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;
});
}

/* CART */
function add(i){
cart.push(products[i]);
total+=products[i].price;

renderCart();
updateCount();
}

function renderCart(){
document.getElementById("list").innerHTML=
cart.map(c=>`<li>${c.name} - $${c.price}</li>`).join("");

document.getElementById("total").innerText=total;
updateCount();
}

function updateCount(){
document.getElementById("count").innerText=cart.length;
}

/* TOGGLE CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
document.getElementById("backdrop").classList.toggle("show");
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* LOGIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");

if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
renderAdmin();
}else{
alert("Acceso denegado");
}
}

/* 🔐 CAMBIAR PASSWORD */
function changePass(){
let old=document.getElementById("oldPass").value;
let neu=document.getElementById("newPass").value;

if(old!==PASS){
alert("Contraseña actual incorrecta");
return;
}

PASS=neu;
savePass();

alert("Contraseña actualizada ✔");
}

/* ADMIN */
function renderAdmin(){
let box=document.getElementById("list");
box.innerHTML="";

products.forEach((p,i)=>{
box.innerHTML+=`
<div class="adminBox">
<input value="${p.name}" onchange="edit(${i},this.value)">
<input value="${p.price}" onchange="price(${i},this.value)">
<button onclick="del(${i})">Eliminar</button>
</div>
`;
});
}

function edit(i,v){
products[i].name=v;
save();
}

function price(i,v){
products[i].price=parseFloat(v);
save();
}

function del(i){
products.splice(i,1);
save();
render();
renderAdmin();
}

/* ADD PRODUCT */
function addProduct(){
let n=document.getElementById("n").value;
let p=document.getElementById("p").value;
let i=document.getElementById("i").value;

products.push({name:n,price:parseFloat(p),img:i});
save();
render();
renderAdmin();
}

/* SAVE DB */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

render();

</script>

</body>
</html>
