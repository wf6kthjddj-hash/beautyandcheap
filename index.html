<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:1000;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

button{
cursor:pointer;
padding:8px;
border:none;
border-radius:8px;
margin-top:6px;
}

.buy{background:#111;color:#fff}

.cart{
position:fixed;
right:0;
top:0;
width:340px;
height:100%;
background:#fff;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.25s;
display:flex;
flex-direction:column;
z-index:9999;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}

.admin{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
z-index:10000;
}

.admin.open{transform:translateX(0)}

.admin input{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:none;
}

.admin button{
background:#fff;
color:#111;
width:100%;
}
</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<div>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
<button onclick="openCart()">🛒 <span id="count">0</span></button>
<button onclick="openAdmin()">Admin</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>✨ Tienda Pro estable</h2>
<p>Inventario + carrito + admin seguro.</p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="openCart()">Cerrar carrito</button>
<div class="cartBody" id="cartList"></div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Admin</h3>

<div id="loginBox">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="panel" style="display:none">

<h3>Panel Admin</h3>

<h4>🔐 Cambiar credenciales</h4>
<input id="newUser" placeholder="Nuevo usuario">
<input id="newPass" type="password" placeholder="Nueva contraseña">
<button onclick="changePass()">Guardar</button>

<hr>

<h4>➕ Agregar / Sumar stock</h4>
<input id="pname" placeholder="Nombre producto">
<input id="pprice" placeholder="Precio">
<button onclick="addProduct()">Agregar</button>

<hr>

<h4>📦 Productos</h4>
<div id="adminList"></div>

<hr>

<h4>🧹 Carrito</h4>
<button onclick="clearCart()">Vaciar carrito</button>
<p>Total: $<span id="total">0</span></p>

</div>

</div>

<script>

/* 🔐 ADMIN */
let ADMIN_USER=localStorage.getItem("adminUser")||"admin";
let ADMIN_PASS=localStorage.getItem("adminPass")||"1234";

let logged=false;

/* 📦 INVENTARIO */
let products=[
{id:1,name:"AOA Brush Cleaning Egg Black",price:45,img:"egg_black.jpg",stock:2},
{id:2,name:"AOA Brush Cleaning Egg Purple",price:45,img:"egg_purple.jpg",stock:1},

{id:3,name:"AOA Cuticle Revitalizing Pen Peach",price:55,img:"cuticle_peach.jpg",stock:1},
{id:4,name:"AOA Cuticle Revitalizing Pen Strawberry",price:55,img:"cuticle_strawberry.jpg",stock:2},
{id:5,name:"AOA Cuticle Revitalizing Pen Rose",price:55,img:"cuticle_rose.jpg",stock:2},

{id:6,name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",stock:5},

{id:7,name:"AOA Retro Chic Lipstick Mod",price:70,img:"lipstick_mod.jpg",stock:1},

{id:8,name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",stock:2},
{id:9,name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",stock:2},

{id:10,name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",stock:3},

{id:11,name:"AOA Magical Lip Stain Kuu",price:75,img:"lip_kuu.jpg",stock:1},
{id:12,name:"AOA Magical Lip Stain Hime",price:75,img:"lip_hime.jpg",stock:1},

{id:13,name:"AOA Headband Soft Pink",price:45,img:"headband_pink.jpg",stock:1},
{id:14,name:"AOA Headband Soft Purple",price:45,img:"headband_purple.jpg",stock:1},

{id:15,name:"AOA Wonder Blender Pink",price:45,img:"blender_pink.jpg",stock:1},
{id:16,name:"AOA Wonder Blender Black",price:45,img:"blender_black.jpg",stock:1}
];

let cart=[];

/* INIT */
document.addEventListener("DOMContentLoaded",()=>render());

/* 🛍️ SHOP */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<p>Stock: ${p.stock}</p>

<button class="buy" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>
Agregar
</button>
</div>
`;
});

renderCart();
renderAdmin();
}

/* ➕ ADD CART */
function add(id){
let p=products.find(x=>x.id===id);
if(!p || p.stock<=0) return;

p.stock--;
cart.push({id:p.id,name:p.name,price:p.price});
render();
}

/* 🛒 CART */
function renderCart(){
let box=document.getElementById("cartList");
box.innerHTML="";

let total=0;

cart.forEach((c,i)=>{
total+=c.price;
box.innerHTML+=`
<div>
<b>${c.name}</b>
<button onclick="removeItem(${i})">Eliminar</button>
</div>
`;
});

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=total;
}

/* ❌ REMOVE ITEM */
function removeItem(i){
let item=cart[i];
let p=products.find(x=>x.id===item.id);

if(p) p.stock++;

cart.splice(i,1);
render();
}

/* 🧹 CLEAR CART */
function clearCart(){
cart.forEach(c=>{
let p=products.find(x=>x.id===c.id);
if(p) p.stock++;
});
cart=[];
render();
}

/* 🔐 LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u===ADMIN_USER && p===ADMIN_PASS){
logged=true;
document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";
renderAdmin();
}else{
alert("Acceso incorrecto");
}
}

/* 🔑 CAMBIAR CREDENCIALES */
function changePass(){
let u=document.getElementById("newUser").value;
let p=document.getElementById("newPass").value;

if(u) ADMIN_USER=u;
if(p) ADMIN_PASS=p;

localStorage.setItem("adminUser",ADMIN_USER);
localStorage.setItem("adminPass",ADMIN_PASS);

alert("Credenciales actualizadas");
}

/* ➕ ADD PRODUCT / SUM STOCK */
function addProduct(){
let name=document.getElementById("pname").value;
let price=+document.getElementById("pprice").value;

if(!name) return;

let p=products.find(x=>x.name.toLowerCase()===name.toLowerCase());

if(p){
p.stock++;
}else{
products.push({
id:Date.now(),
name,
price:price||50,
img:"default.jpg",
stock:5
});
}

render();
}

/* 🗑️ DELETE PRODUCT */
function deleteProduct(id){
products=products.filter(p=>p.id!==id);
render();
}

/* 🔧 ADMIN */
function renderAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div style="border-bottom:1px solid #444;padding:8px 0">
<b>${p.name}</b><br>
Stock: ${p.stock}<br>

<button onclick="deleteProduct(${p.id})" style="background:red;color:#fff;margin-top:6px">
Eliminar producto
</button>
</div>
`;
});
}

/* UI */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function openCart(){
document.getElementById("cart").classList.toggle("open");
}

function openAdmin(){
if(!logged){
alert("Debes iniciar sesión");
return;
}
document.getElementById("admin").classList.toggle("open");
}

render();

</script>

</body>
</html>
