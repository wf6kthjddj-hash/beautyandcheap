<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>

<style>
body{font-family:Arial;margin:0;background:#fafafa;color:#333}

header{
background:#111;color:#fff;
padding:15px;text-align:center;
font-size:22px;
position:relative;
}

nav{display:flex;justify-content:center;gap:20px;background:#222;padding:10px}

nav button{
background:none;border:none;
color:#fff;font-size:16px;
cursor:pointer;
}

.section{display:none;padding:20px}
.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#fff;border-radius:10px;
padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1)
}

.card img{
width:100%;height:180px;
object-fit:cover;
border-radius:10px
}

button.buy{
background:#111;color:#fff;
border:none;padding:8px;
margin-top:10px;width:100%;
cursor:pointer
}

select{width:100%;padding:5px;margin-top:5px}

/* 🛒 CART STYLE PRO */
.cart{
position:fixed;
right:0;top:0;
width:300px;height:100%;
background:#fff;
border-left:1px solid #ccc;
padding:10px;
overflow:auto;
transform:translateX(100%);
transition:0.3s ease;
z-index:999;
}

.cart.open{
transform:translateX(0);
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-toggle{
position:absolute;
right:15px;
top:12px;
background:#fff;
color:#111;
border:none;
padding:5px 10px;
cursor:pointer;
border-radius:5px;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button class="cart-toggle" onclick="toggleCart()">🛒</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Tu glow empieza aquí ✨</h2>
<p>Maquillaje accesible, cute y de calidad 💋</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- 🛒 CART -->
<div class="cart" id="cartPanel">
<div class="cart-header">
<h3>Carrito</h3>
<button onclick="toggleCart()">✖</button>
</div>

<ul id="cart"></ul>
<p>Total: $<span id="total">0</span></p>
</div>

<script>

const products=[
{
name:"AOA Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:[
{label:"Black",key:"black"},
{label:"Purple",key:"purple"}
],
stock:{black:1,purple:1}
},

{
name:"AOA Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:[
{label:"Peach",key:"peach"},
{label:"Strawberry",key:"strawberry"},
{label:"Rose",key:"rose"}
],
stock:{peach:1,strawberry:2,rose:2}
},

{
name:"AOA Makeup Remover Wipes",
price:50,
img:"wipes.jpg",
options:[{label:"Único",key:"default"}],
stock:{default:5}
},

{
name:"AOA Retro Chic Lipstick",
price:70,
img:"lipstick_mod.jpg",
options:[{label:"Mod",key:"mod"}],
stock:{mod:1}
},

{
name:"Chamomile Foot Mask",
price:65,
img:"foot_chamomile.jpg",
options:[{label:"Chamomile",key:"chamomile"}],
stock:{chamomile:2}
},

{
name:"Foot Peeling Mask",
price:75,
img:"foot_peeling.jpg",
options:[{label:"Peeling",key:"peeling"}],
stock:{peeling:2}
},

{
name:"Rose Foot Mask",
price:65,
img:"foot_rose.jpg",
options:[{label:"Rose",key:"rose"}],
stock:{rose:2}
},

{
name:"Acne Patches 10mm",
price:65,
img:"acne_patches.jpg",
options:[{label:"10mm",key:"default"}],
stock:{default:3}
},

{
name:"Magical Girl Lip Stain",
price:75,
img:"lip_kuu.jpg",
options:[
{label:"Kuu",key:"kuu"},
{label:"Hime",key:"hime"}
],
stock:{kuu:1,hime:1}
},

{
name:"Soft Headband",
price:45,
img:"headband_pink_ears.jpg",
options:[
{label:"Pink Ears",key:"pink_ears"},
{label:"Purple Ears",key:"purple_ears"}
],
stock:{pink_ears:1,purple_ears:1}
},

{
name:"Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:[
{label:"Pink",key:"pink"},
{label:"Black",key:"black"}
],
stock:{pink:1,black:1}
}
];

let cart=[];
let total=0;

function render(){
const container=document.getElementById("products");
container.innerHTML="";

products.forEach((p,i)=>{

let opt=p.options.map(o=>
`<option value="${o.key}">${o.label}</option>`
).join("");

container.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="updateStock(${i})">
${opt}
</select>

<p id="stock${i}"></p>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

function getStock(p,key){
return p.stock[key] ?? p.stock.default ?? 0;
}

function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
document.getElementById("stock"+i).innerText =
"Stock: " + getStock(p,sel);
}

function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if(getStock(p,sel)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;

cart.push({
name:p.name,
option:sel,
price:p.price
});

total+=p.price;

renderCart();
updateStock(i);
}

function renderCart(){
document.getElementById("cart").innerHTML =
cart.map(c=>`<li>${c.name} (${c.option}) - $${c.price}</li>`).join("");

document.getElementById("total").innerText=total;
}

function toggleCart(){
document.getElementById("cartPanel").classList.toggle("open");
}

function show(sec){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(sec).classList.add("active");
}

render();
</script>

</body>
</html>
