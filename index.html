<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:1000;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
}

/* CARD */
.card{
background:#fff;
padding:12px;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

select,input{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:1px solid #ddd;
}

/* BUTTON */
button{
cursor:pointer;
padding:8px;
border:none;
border-radius:8px;
margin-top:6px;
}

.buy{background:#111;color:#fff}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:340px;
height:100%;
background:#fff;
border-left:1px solid #ddd;
transform:translateX(100%);
transition:.25s;
display:flex;
flex-direction:column;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}

/* ADMIN */
.admin{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
}

.admin.open{transform:translateX(0)}

.admin input{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:none;
}

.admin button{
background:#fff;
color:#111;
width:100%;
}
</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<div>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
<button onclick="toggleCart()">🛒 <span id="count">0</span></button>
<button onclick="toggleAdmin()">Admin</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>✨ Tienda de belleza organizada</h2>
<p>Stock, variantes y control de inventario funcional.</p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="toggleCart()">Cerrar carrito</button>
<div class="cartBody" id="cartList"></div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Admin</h3>

<input id="name" placeholder="Nombre producto">
<input id="price" placeholder="Precio">
<input id="variant" placeholder="Color / Olor (opcional)">
<button onclick="addProduct()">Agregar / Sumar stock</button>

<hr>

<div id="adminList"></div>

</div>

<script>

/* INVENTARIO */
let products = [
{id:1,name:"AOA Brush Egg",price:45,img:"egg_black.jpg",variants:["black","purple"],stock:3},
{id:2,name:"Cuticle Pen",price:55,img:"cuticle_peach.jpg",variants:["peach","strawberry"],stock:5},
{id:3,name:"Wipes sin aroma",price:50,img:"wipes.jpg",variants:["sin aroma"],stock:5}
];

let cart=[];

/* SHOP */
function render(){

let box=document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{

let opt = (p.variants||[]).map(v=>`<option>${v}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="v${p.id}">
${opt}
</select>

<button class="buy" onclick="add(${p.id})">Agregar</button>
</div>
`;
});

renderCart();
renderAdmin();
}

/* ADD CART */
function add(id){

let p=products.find(x=>x.id===id);
let v=document.getElementById("v"+id)?.value || "";

if(p.stock<=0) return alert("Agotado");

p.stock--;
cart.push({id:p.id,name:p.name,variant:v,price:p.price});

render();
}

/* CART */
function renderCart(){

let box=document.getElementById("cartList");
box.innerHTML="";

cart.forEach((c,i)=>{
box.innerHTML+=`
<div>
<b>${c.name}</b> ${c.variant?`(${c.variant})`:``}
<button onclick="removeItem(${i})">Eliminar</button>
</div>
`;
});

document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(i){

let item=cart[i];

let p=products.find(x=>x.id===item.id);
if(p) p.stock++;

cart.splice(i,1);
render();
}

/* ADMIN */
function addProduct(){

let n=name.value.trim();
let pr=+price.value;
let v=variant.value.trim();

if(!n) return alert("Nombre requerido");

let existing = products.find(p=>p.name.toLowerCase()===n.toLowerCase());

if(existing){
existing.stock++;
if(v && !existing.variants.includes(v)){
existing.variants.push(v);
}
}else{
products.push({
id:Date.now(),
name:n,
price:pr||50,
img:"default.jpg",
variants:v?[v]:[],
stock:5
});
}

render();
}

/* UI */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function toggleAdmin(){
document.getElementById("admin").classList.toggle("open");
}

render();

</script>

</body>
</html>
