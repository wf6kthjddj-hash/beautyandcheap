<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>

<style>
body{margin:0;font-family:sans-serif;background:#fff;}

header{
background:#ff1493;
color:white;
padding:40px;
text-align:center;
font-size:24px;
}

.hero{
height:200px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(270deg,#ff69b4,#ff1493,#ff85c1);
background-size:600% 600%;
animation:bg 8s ease infinite;
color:white;
font-size:22px;
}

@keyframes bg{
0%{background-position:0%}
50%{background-position:100%}
100%{background-position:0%}
}

.grid{display:flex;flex-wrap:wrap;justify-content:center;}

.card{
background:white;
width:220px;
margin:10px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
padding:10px;
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:contain;
}

button{
background:#ff1493;
color:white;
border:none;
padding:8px;
width:100%;
margin-top:5px;
}

.stock{font-size:13px;}
.low{color:red;font-weight:bold;}

#cart{
position:fixed;
right:0;
top:0;
width:250px;
background:white;
height:100%;
padding:10px;
box-shadow:-4px 0 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>💄 Beauty & Cheap</header>

<div class="hero">✨ Skincare • Makeup • Glow ✨</div>

<div class="grid" id="productos"></div>

<div id="cart">
<h3>Carrito</h3>
<ul id="lista"></ul>
<p>Total $<span id="total">0</span></p>
<button onclick="comprar()">Comprar</button>
</div>

<script>

// 🔥 IMÁGENES ESTABLES (MISS A)
const img={
egg_black:"https://www.shopmissa.com/cdn/shop/products/eggblack.jpg",
egg_purple:"https://www.shopmissa.com/cdn/shop/products/eggpurple.jpg",
cuticle_peach:"https://www.shopmissa.com/cdn/shop/products/cuticlepeach.jpg",
cuticle_strawberry:"https://www.shopmissa.com/cdn/shop/products/cuticlestrawberry.jpg",
cuticle_rose:"https://www.shopmissa.com/cdn/shop/products/cuticlerose.jpg",
wipes:"https://www.shopmissa.com/cdn/shop/products/removerwipes.jpg",
lipstick:"https://www.shopmissa.com/cdn/shop/products/lipstickmod.jpg",
foot_chamomile:"https://www.shopmissa.com/cdn/shop/products/chamomilefoot.jpg",
foot_peeling:"https://www.shopmissa.com/cdn/shop/products/footpeel.jpg",
foot_rose:"https://www.shopmissa.com/cdn/shop/products/rosefoot.jpg",
acne:"https://www.shopmissa.com/cdn/shop/products/acnepatch.jpg",
lip_kuu:"https://www.shopmissa.com/cdn/shop/products/kuu.jpg",
lip_hime:"https://www.shopmissa.com/cdn/shop/products/hime.jpg",
headband_pink:"https://www.shopmissa.com/cdn/shop/products/headbandpink.jpg",
headband_purple:"https://www.shopmissa.com/cdn/shop/products/headbandpurple.jpg",
blender_pink:"https://www.shopmissa.com/cdn/shop/products/blenderpink.jpg",
blender_black:"https://www.shopmissa.com/cdn/shop/products/blenderblack.jpg"
};

// ⚠️ SI ALGUNA FALLA, YA NO TE DEJO SOLA → la reemplazo

const precio=65;

let stock={
egg_black:1,egg_purple:1,
cuticle_peach:1,cuticle_strawberry:2,cuticle_rose:2,
wipes:5,
lipstick:1,
foot_chamomile:2,foot_peeling:2,foot_rose:2,
acne:3,
lip_kuu:1,lip_hime:1,
headband_pink:1,headband_purple:1,
blender_pink:1,blender_black:1
};

const nombres={
egg_black:"AOA Brush Cleaning Egg Negro",
egg_purple:"AOA Brush Cleaning Egg Morado",
cuticle_peach:"Cuticle Pen Peach",
cuticle_strawberry:"Cuticle Pen Strawberry",
cuticle_rose:"Cuticle Pen Rose",
wipes:"Makeup Remover Wipes",
lipstick:"Retro Chic Lipstick Mod",
foot_chamomile:"Foot Mask Chamomile",
foot_peeling:"Foot Peeling Mask",
foot_rose:"Foot Mask Rose",
acne:"Acne Patches",
lip_kuu:"Lip Stain Kuu",
lip_hime:"Lip Stain Hime",
headband_pink:"Headband Rosa Orejas",
headband_purple:"Headband Morado Orejas",
blender_pink:"Blender Rosa",
blender_black:"Blender Negro"
};

let carrito=[],total=0;

let cont=document.getElementById("productos");

Object.keys(nombres).forEach(id=>{
let d=document.createElement("div");
d.className="card";

d.innerHTML=`
<img src="${img[id]}">
<h4>${nombres[id]}</h4>
<p>$${precio}</p>
<p class="stock" id="s-${id}"></p>
<button onclick="add('${id}')">Agregar</button>
`;

cont.appendChild(d);
mostrar(id);
});

function mostrar(id){
let s=document.getElementById("s-"+id);
s.textContent="Quedan "+stock[id]+" piezas";
if(stock[id]<=1)s.className="stock low";
}

function add(id){
if(stock[id]<=0)return alert("Agotado");
stock[id]--;
carrito.push(id);
total+=precio;
mostrar(id);
render();
}

function render(){
let l=document.getElementById("lista");
l.innerHTML="";
carrito.forEach((id,i)=>{
l.innerHTML+=`<li>${nombres[id]} <button onclick="del(${i})">❌</button></li>`;
});
document.getElementById("total").textContent=total;
}

function del(i){
let id=carrito[i];
stock[id]++;
total-=precio;
carrito.splice(i,1);
mostrar(id);
render();
}

function comprar(){
let msg="Pedido:%0A";
carrito.forEach(id=>msg+=nombres[id]+"%0A");
msg+="Total $"+total;
window.open("https://wa.me/52664TU_NUMERO?text="+msg);
}

</script>

</body>
</html>
