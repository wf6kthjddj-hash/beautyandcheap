<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 Pro</title>

<style>
body{margin:0;font-family:system-ui;background:#f4f4f7}

header{
background:#fff;
padding:14px;
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
position:sticky;top:0;
z-index:1000;
}

.section{display:none;padding:20px}
.section.active{display:block}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:12px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

select,input{
width:100%;
padding:8px;
margin-top:6px;
border-radius:8px;
border:1px solid #ddd;
}

button{cursor:pointer}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:360px;
height:100%;
background:#fff;
transform:translateX(100%);
transition:.3s;
display:flex;
flex-direction:column;
border-left:1px solid #ddd;
}
.cart.open{transform:translateX(0)}

.cartBody{flex:1;overflow:auto;padding:10px}
.cartFooter{padding:10px;border-top:1px solid #ddd}

/* ADMIN */
.admin{
position:fixed;
left:0;
top:0;
width:420px;
height:100%;
background:#f7f7f7;
transform:translateX(-110%);
transition:.3s;
padding:14px;
overflow:auto;
}
.admin.open{transform:translateX(0)}

.adminCard{
background:#fff;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #eee;
}
</style>
</head>

<body>

<header>
<div><b>💄 Beauty & Cheap</b></div>

<div>
<button onclick="show('shop')">Tienda</button>
<button onclick="show('home')">Inicio</button>
<button onclick="toggleCart()">🛒 <span id="count">0</span></button>
<button onclick="toggleAdmin()">Admin</button>
</div>
</header>

<!-- HOME -->
<div id="home" class="section active">
<h2>✨ Sistema estable versión 2</h2>
<p>Inventario real + control seguro de stock.</p>
</div>

<!-- SHOP -->
<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<button onclick="toggleCart()">Cerrar</button>
<div class="cartBody" id="cartList"></div>
<div class="cartFooter">Total: $<span id="total">0</span></div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

<h3>Panel Admin</h3>

<input id="search" placeholder="Buscar producto...">

<input id="name" placeholder="Nombre">
<input id="price" placeholder="Precio">
<button onclick="addOrUpdate()">Agregar / Sumar stock</button>

<div id="adminList"></div>

</div>

<script>

/* 🧠 INVENTARIO REAL (TU BASE) */
let products = [
{id:1,name:"AOA Brush Cleaning Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{id:2,name:"AOA Cuticle Revitalizing Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{id:3,name:"AOA Makeup Remover Wipes - sin aroma",price:50,img:"wipes.jpg",options:["sin aroma"],stock:{"sin aroma":5}},
{id:4,name:"AOA Retro Chic Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{id:5,name:"AOA Foot Mask Chamomile",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{id:6,name:"AOA Foot Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}},
{id:7,name:"AOA Acne Patches 10mm",price:65,img:"acne_patches.jpg",options:["10mm"],stock:{"10mm":3}},
{id:8,name:"AOA Magical Lip Stain",price:75,img:"lip_kuu.jpg",options:["kuu","hime"],stock:{kuu:1,hime:1}},
{id:9,name:"AOA Headband Soft",price:45,img:"headband_pink_ears.jpg",options:["pink","purple"],stock:{pink:1,purple:1}},
{id:10,name:"AOA Wonder Blender",price:45,img:"blender_pink.jpg",options:["pink","black"],stock:{pink:1,black:1}}
];

let cart=[];
let total=0;

/* 🔄 RENDER SHOP */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach(p=>{

let opts=Object.keys(p.stock)
.map(o=>`<option value="${o}">${o} (${p.stock[o]})</option>`)
.join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${p.id}">
${opts}
</select>

<button onclick="add(${p.id})">Agregar</button>
</div>
`;
});

renderCart();
renderAdmin();
}

/* 🛒 ADD */
function add(id){

let p=products.find(x=>x.id===id);
let sel=document.getElementById("opt"+id).value;

if(!p.stock[sel]) return alert("Agotado");

p.stock[sel]--;

cart.push({id:p.id,name:p.name,option:sel,price:p.price});
total+=p.price;

render();
}

/* 🧾 CART */
function renderCart(){

let box=document.getElementById("cartList");
box.innerHTML="";

cart.forEach((c,i)=>{
box.innerHTML+=`
<div>
<b>${c.name}</b> (${c.option})
<button onclick="removeItem(${i})">X</button>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* ❌ REMOVE */
function removeItem(i){

let item=cart[i];
total-=item.price;

let p=products.find(x=>x.id===item.id);
if(p){
p.stock[item.option]=(p.stock[item.option]||0)+1;
}

cart.splice(i,1);
render();
}

/* ➕ ADD OR UPDATE STOCK */
function addOrUpdate(){

let name=nameInput();
let price=+priceInput();

if(!name) return;

let existing = products.find(p =>
p.name.toLowerCase() === name.toLowerCase()
);

if(existing){
let key=Object.keys(existing.stock)[0];
existing.stock[key]++;
}else{
products.push({
id:Date.now(),
name:name,
price:price||50,
img:"default.jpg",
options:["default"],
stock:{default:5}
});
}

render();
}

/* 🔎 HELPERS */
function nameInput(){return document.getElementById("name").value}
function priceInput(){return document.getElementById("price").value}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function toggleAdmin(){
document.getElementById("admin").classList.toggle("open");
}

render();

</script>

</body>
</html>
