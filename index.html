<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>
<style>
body{font-family:Arial;margin:0;background:#fafafa;color:#333}
header{background:#111;color:#fff;padding:15px;text-align:center;font-size:22px}
nav{display:flex;justify-content:center;gap:20px;background:#222;padding:10px}
nav button{background:none;border:none;color:#fff;font-size:16px;cursor:pointer}
.section{display:none;padding:20px}
.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}
button.buy{background:#111;color:#fff;border:none;padding:8px;margin-top:10px;width:100%;cursor:pointer}
select{width:100%;padding:5px;margin-top:5px}
.cart{position:fixed;right:0;top:0;width:280px;height:100%;background:#fff;border-left:1px solid #ccc;padding:10px;overflow:auto}
</style>
</head>

<body>

<header>Beauty & Cheap 💄</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active">
<h2>✨ Tu glow empieza aquí ✨</h2>
<p>Maquillaje accesible, cute y de calidad. Porque verte bien no debe costar caro 💋</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<div class="cart">
<h3>🛒 Carrito</h3>
<ul id="cart"></ul>
<p>Total: $<span id="total">0</span></p>
</div>

<script>

const products=[

{
name:"AOA Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:["Black","Purple"],
stock:{black:1,purple:1}
},

{
name:"AOA Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:["Peach","Strawberry","Rose"],
stock:{peach:1,strawberry:2,rose:2}
},

{
name:"AOA Makeup Remover Wipes - Unscented",
price:50,
img:"wipes.jpg",
options:["Único"],
stock:{default:5}
},

{
name:"AOA Retro Chic Lipstick - Mod",
price:70,
img:"lipstick_mod.jpg",
options:["Mod"],
stock:{mod:1}
},

{
name:"AOA Skin Chamomile Foot Sheet Mask",
price:65,
img:"foot_chamomile.jpg",
options:["Chamomile"],
stock:{chamomile:2}
},

{
name:"AOA Skin Foot Peeling Mask",
price:75,
img:"foot_peeling.jpg",
options:["Peeling"],
stock:{peeling:2}
},

{
name:"AOA Skin Rose Foot Sheet Mask",
price:65,
img:"foot_rose.jpg",
options:["Rose"],
stock:{rose:2}
},

{
name:"AOA Skin Invisible Acne Patches 10mm",
price:65,
img:"acne_patches.jpg",
options:["10mm"],
stock:{default:3}
},

{
name:"AOA Magical Girl Lip Stain",
price:75,
img:"lip_kuu.jpg",
options:["Kuu","Hime"],
stock:{kuu:1,hime:1}
},

{
name:"AOA Soft + Plush Headband",
price:45,
img:"headband_pink_ears.jpg",
options:["Pink Ears","Purple Ears"],
stock:{pink:1,purple:1}
},

{
name:"AOA Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:["Pink","Black"],
stock:{pink:1,black:1}
}

];

let cart=[];
let total=0;

function render(){
const container=document.getElementById("products");
container.innerHTML="";

products.forEach((p,i)=>{
let opt=p.options.map(o=>`<option>${o}</option>`).join("");

container.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>
<select id="opt${i}">${opt}</select>
<p id="stock${i}"></p>
<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value.toLowerCase().split(" ")[0];
let stock=p.stock[sel] ?? p.stock.default;
document.getElementById("stock"+i).innerText="Stock: "+stock;
}

function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value.toLowerCase().split(" ")[0];

if((p.stock[sel] ?? p.stock.default)<=0){
alert("Agotado 😢");
return;
}

p.stock[sel]--;
updateStock(i);

cart.push(p.name+" ("+sel+") - $"+p.price);
total+=p.price;

document.getElementById("cart").innerHTML=cart.map(c=>"<li>"+c+"</li>").join("");
document.getElementById("total").innerText=total;
}

function show(sec){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(sec).classList.add("active");
}

render();

document.addEventListener("change", e=>{
if(e.target.tagName==="SELECT"){
let i=e.target.id.replace("opt","");
updateStock(i);
}
});

</script>

</body>
</html>
