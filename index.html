<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f8f8f8;
}

/* HEADER */
header{
  background:white;
  padding:20px;
  text-align:center;
  font-size:26px;
  letter-spacing:3px;
  border-bottom:1px solid #eee;
}

/* HERO */
.hero{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:white;
  background:linear-gradient(270deg,#ff1493,#ff69b4,#ff85c1);
  background-size:600% 600%;
  animation:move 10s infinite;
}

@keyframes move{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

/* GRID */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:180px;
  object-fit:contain;
}

/* TEXT */
h4{
  font-size:15px;
  margin:10px 0;
}

.price{
  font-weight:bold;
  margin:5px 0;
}

/* SELECT */
select{
  width:100%;
  padding:8px;
  margin-top:5px;
}

/* STOCK */
.stock{
  font-size:13px;
  margin-top:5px;
}

.low{
  color:red;
  font-weight:bold;
}

/* BUTTON */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:8px;
}

/* CART */
.cart{
  position:fixed;
  right:0;
  top:0;
  width:280px;
  height:100%;
  background:white;
  box-shadow:-4px 0 15px rgba(0,0,0,0.1);
  padding:15px;
  overflow:auto;
}

.cart h3{
  margin-top:0;
}

.whatsapp{
  background:#25D366;
  margin-top:10px;
}

</style>
</head>

<body>

<header>BEAUTY & CHEAP</header>

<div class="hero">
✨ Maquillaje bonito. Precios irresistibles. ✨
</div>

<div class="products" id="products"></div>

<div class="cart">
<h3>🛒 Carrito</h3>
<div id="cartItems"></div>
<h4>Total: $<span id="total">0</span></h4>
<button class="whatsapp" onclick="comprar()">Comprar por WhatsApp</button>
</div>

<script>

const products=[

{
name:"AOA Brush Cleaning Egg",
price:45,
img:"egg_black.jpg",
options:["Black","Purple"],
stock:{black:1,purple:1}
},

{
name:"AOA Cuticle Revitalizing Pen",
price:55,
img:"cuticle_peach.jpg",
options:["Peach","Strawberry","Rose"],
stock:{peach:1,strawberry:2,rose:2}
},

{
name:"AOA Makeup Remover Wipes",
price:50,
img:"wipes.jpg",
options:["Único"],
stock:{default:5}
},

{
name:"AOA Retro Chic Lipstick",
price:70,
img:"lipstick_mod.jpg",
options:["Mod"],
stock:{mod:1}
},

{
name:"AOA Foot Masks",
price:65,
img:"foot_chamomile.jpg",
options:["Chamomile","Peeling","Rose"],
stock:{chamomile:2,peeling:2,rose:2}
},

{
name:"AOA Acne Patches",
price:65,
img:"acne_patches.jpg",
options:["Único"],
stock:{default:3}
},

{
name:"AOA Magical Girl Lip Stain",
price:75,
img:"lip_kuu.jpg",
options:["Kuu","Hime"],
stock:{kuu:1,hime:1}
},

{
name:"AOA Plush Headband",
price:45,
img:"headband_pink_ears.jpg",
options:["Pink","Purple"],
stock:{pink:1,purple:1}
},

{
name:"AOA Wonder Blender",
price:45,
img:"blender_pink.jpg",
options:["Pink","Black"],
stock:{pink:1,black:1}
}

];

let cart=[];
let total=0;

/* RENDER PRODUCTOS */
function renderProducts(){
const container=document.getElementById("products");
container.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option>${o}</option>`).join("");

let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">$${p.price}</p>

<select id="opt-${i}" onchange="updateStock(${i})">
${opts}
</select>

<p id="stock-${i}" class="stock"></p>

<button onclick="addToCart(${i})">Agregar</button>
`;

container.appendChild(div);
updateStock(i);
});
}

/* STOCK */
function updateStock(i){
let p=products[i];
let val=document.getElementById(`opt-${i}`).value.toLowerCase();

let s=p.stock[val] ?? p.stock.default;

let el=document.getElementById(`stock-${i}`);
el.innerText="Quedan "+s+" piezas";

el.className="stock";
if(s<=1) el.classList.add("low");
}

/* AGREGAR */
function addToCart(i){
let p=products[i];
let val=document.getElementById(`opt-${i}`).value.toLowerCase();

let key=p.stock[val]!==undefined?val:"default";

if(p.stock[key]<=0) return alert("Agotado");

p.stock[key]--;
cart.push({name:p.name+" - "+val,price:p.price});
total+=p.price;

renderProducts();
renderCart();
}

/* CARRITO */
function renderCart(){
let c=document.getElementById("cartItems");
c.innerHTML="";

cart.forEach((item,i)=>{
c.innerHTML+=`<p>${item.name} - $${item.price}</p>`;
});

document.getElementById("total").innerText=total;
}

/* WHATSAPP */
function comprar(){
let msg="Hola! Quiero pedir:%0A";

cart.forEach(i=>{
msg+=i.name+"%0A";
});

msg+="Total: $"+total;

window.open("https://wa.me/52664XXXXXXXX?text="+msg);
}

renderProducts();

</script>

</body>
</html>
