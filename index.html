<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty & Cheap 💄 | Pro Store</title>

<style>
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Arial;
background:#f5f5f7;
color:#111;
}

/* HEADER */
header{
background:#fff;
border-bottom:1px solid #eaeaea;
padding:16px;
text-align:center;
font-weight:600;
position:sticky;
top:0;
z-index:1000;
}

/* NAV */
nav{
display:flex;
justify-content:center;
gap:16px;
background:#fff;
padding:10px;
border-bottom:1px solid #eee;
}

nav button{
background:none;
border:none;
cursor:pointer;
font-weight:500;
color:#333;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
padding:20px;
}

/* PRODUCT CARD */
.card{
background:#fff;
border-radius:16px;
padding:12px;
box-shadow:0 6px 18px rgba(0,0,0,.06);
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:14px;
}

select{
width:100%;
padding:8px;
margin-top:6px;
border-radius:10px;
border:1px solid #ddd;
}

button.buy{
width:100%;
margin-top:10px;
padding:10px;
border:none;
background:#111;
color:#fff;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:380px;
height:100%;
background:#fff;
border-left:1px solid #eee;
transform:translateX(100%);
transition:.3s;
z-index:9999;
display:flex;
flex-direction:column;
}

.cart.open{transform:translateX(0)}

.cartHeader{
padding:14px;
border-bottom:1px solid #eee;
font-weight:600;
}

.cartBody{
flex:1;
overflow:auto;
padding:12px;
}

.cartItem{
border:1px solid #eee;
border-radius:12px;
padding:10px;
margin-bottom:10px;
}

.cartItem small{
opacity:.6;
display:block;
margin-top:2px;
}

.cartRow{
display:flex;
justify-content:space-between;
margin-top:8px;
align-items:center;
}

.removeBtn{
background:#111;
color:#fff;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:12px;
}

.cartFooter{
border-top:1px solid #eee;
padding:12px;
}

.checkoutBtn{
width:100%;
padding:12px;
border:none;
background:#111;
color:#fff;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.totalBox{
margin-bottom:10px;
font-weight:700;
}

/* ADMIN BUTTON (FLOAT) */
.adminBtn{
position:fixed;
left:20px;
bottom:20px;
background:#111;
color:#fff;
border:none;
padding:12px 16px;
border-radius:999px;
cursor:grab;
z-index:10001;
}

/* ADMIN PANEL */
.adminPanel{
position:fixed;
left:0;
top:0;
width:380px;
height:100%;
background:#111;
color:#fff;
padding:12px;
transform:translateX(-110%);
transition:.3s;
z-index:10000;
overflow:auto;
}

.adminPanel.open{transform:translateX(0)}

.closeAdmin{
background:none;
border:none;
color:#fff;
font-size:18px;
float:right;
cursor:pointer;
}

input{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:none;
}

/* STOCK LABEL */
.stock{
font-size:12px;
opacity:.7;
margin-top:4px;
}

.lowStock{
color:#d9534f;
font-weight:600;
}
</style>
</head>

<body>

<header>
Beauty & Cheap 💄
<button onclick="toggleCart()" style="position:absolute;right:15px;top:10px;">
🛒 <span id="count">0</span>
</button>
</header>

<nav>
<button onclick="show('home')">Inicio</button>
<button onclick="show('shop')">Tienda</button>
</nav>

<div id="home" class="section active" style="padding:20px">
<h2>✨ Beauty & Cheap Pro Store</h2>
<p style="opacity:.6">Experiencia tipo Sephora, sin precios Sephora 😏</p>
</div>

<div id="shop" class="section">
<div class="grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart" id="cart">
<div class="cartHeader">🛒 Tu carrito</div>

<div class="cartBody" id="list"></div>

<div class="cartFooter">
<div class="totalBox">Total: $<span id="total">0</span></div>
<button class="checkoutBtn" onclick="checkoutWhatsApp()">Pagar por WhatsApp 💬</button>
</div>
</div>

<!-- ADMIN -->
<button class="adminBtn" id="adminBtn" onmousedown="dragStart(event)" onclick="login()">Admin</button>

<div class="adminPanel" id="admin">
<button class="closeAdmin" onclick="closeAdmin()">✖</button>

<h3>Dashboard Admin</h3>

<h4>Agregar producto</h4>
<input id="n" placeholder="Nombre">
<input id="p" placeholder="Precio">
<input id="i" placeholder="Imagen">
<button onclick="addProduct()">Guardar</button>

</div>

<script>

/* ADMIN */
let USER="admin";
let PASS=localStorage.getItem("adminPass") || "1234";

/* STOCK REAL COMPLETO */
let products = JSON.parse(localStorage.getItem("db")) || [

{name:"Brush Egg",price:45,img:"egg_black.jpg",options:["black","purple"],stock:{black:2,purple:1}},
{name:"Cuticle Pen",price:55,img:"cuticle_peach.jpg",options:["peach","strawberry","rose"],stock:{peach:1,strawberry:2,rose:2}},
{name:"Wipes",price:50,img:"wipes.jpg",options:["default"],stock:{default:5}},
{name:"Lipstick",price:70,img:"lipstick_mod.jpg",options:["mod"],stock:{mod:1}},
{name:"Foot Mask",price:65,img:"foot_chamomile.jpg",options:["chamomile"],stock:{chamomile:2}},
{name:"Peeling Mask",price:75,img:"foot_peeling.jpg",options:["peeling"],stock:{peeling:2}},
{name:"Acne Patches",price:65,img:"acne_patches.jpg",options:["10mm"],stock:{"10mm":3}},
{name:"Lip Stain",price:75,img:"lip_kuu.jpg",options:["kuu","hime"],stock:{kuu:1,hime:1}},
{name:"Headband",price:45,img:"headband_pink_ears.jpg",options:["pink","purple"],stock:{pink:1,purple:1}},
{name:"Blender",price:45,img:"blender_pink.jpg",options:["pink","black"],stock:{pink:1,black:1}}

];

let cart=[];
let total=0;

/* SAVE */
function save(){
localStorage.setItem("db",JSON.stringify(products));
}

/* RENDER */
function render(){
let box=document.getElementById("products");
box.innerHTML="";

products.forEach((p,i)=>{

let opts=p.options.map(o=>`<option value="${o}">${o}</option>`).join("");

box.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>$${p.price}</p>

<select id="opt${i}" onchange="updateStock(${i})">
${opts}
</select>

<div class="stock" id="stock${i}"></div>

<button class="buy" onclick="add(${i})">Agregar</button>
</div>
`;

updateStock(i);
});
}

/* STOCK */
function updateStock(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;
let s=p.stock[sel]??0;

let el=document.getElementById("stock"+i);

if(s<=1){
el.innerHTML=`<span class="lowStock">Stock bajo: ${s}</span>`;
}else{
el.innerText="Stock: "+s;
}
}

/* ADD */
function add(i){
let p=products[i];
let sel=document.getElementById("opt"+i).value;

if((p.stock[sel]??0)<=0) return alert("Agotado");

p.stock[sel]--;

cart.push({name:p.name,option:sel,price:p.price});
total+=p.price;

renderCart();
updateStock(i);
updateCount();
save();
}

/* CART */
function renderCart(){

let box=document.getElementById("list");
box.innerHTML="";

let grouped={};

cart.forEach(c=>{
let k=c.name+"-"+c.option;
if(!grouped[k]) grouped[k]={...c,qty:1};
else grouped[k].qty++;
});

Object.values(grouped).forEach(i=>{
box.innerHTML+=`
<div class="cartItem">
<h4>${i.name}</h4>
<small>${i.option}</small>
<div class="cartRow">
<span>$${i.price} x ${i.qty}</span>
<button class="removeBtn" onclick="removeItem('${i.name}','${i.option}')">Eliminar</button>
</div>
</div>
`;
});

document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

/* REMOVE */
function removeItem(name,opt){
for(let i=cart.length-1;i>=0;i--){
if(cart[i].name===name && cart[i].option===opt){
total-=cart[i].price;
cart.splice(i,1);
break;
}
}
renderCart();
}

/* CHECKOUT */
function checkoutWhatsApp(){
let msg="🛒 Pedido Pro Beauty:%0A";
let grouped={};

cart.forEach(c=>{
let k=c.name+" "+c.option;
grouped[k]=(grouped[k]||0)+1;
});

for(let k in grouped){
msg+=`- ${k} x${grouped[k]}%0A`;
}

msg+=`%0ATotal: $${total}`;

let phone="52TU_NUMERO";

window.open(`https://wa.me/${phone}?text=${msg}`);
}

/* NAV */
function show(s){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(s).classList.add("active");
}

/* CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

/* ADMIN */
function login(){
let u=prompt("Usuario:");
let p=prompt("Contraseña:");
if(u===USER && p===PASS){
document.getElementById("admin").classList.add("open");
}
}

function closeAdmin(){
document.getElementById("admin").classList.remove("open");
}

/* ADD PRODUCT */
function addProduct(){
let n=document.getElementById("n").value;
let p=parseFloat(document.getElementById("p").value);
let i=document.getElementById("i").value;

products.push({
name:n,
price:p,
img:i,
options:["default"],
stock:{default:5}
});

save();
render();
}

/* DRAG ADMIN */
let drag=false,ox=0,oy=0;

function dragStart(e){
drag=true;
let b=document.getElementById("adminBtn");
let r=b.getBoundingClientRect();

ox=e.clientX-r.left;
oy=e.clientY-r.top;

document.addEventListener("mousemove",move);
document.addEventListener("mouseup",end);
}

function move(e){
if(!drag)return;

let b=document.getElementById("adminBtn");
b.style.left=(e.clientX-ox)+"px";
b.style.top=(e.clientY-oy)+"px";
b.style.bottom="auto";
}

function end(){
drag=false;
document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",end);
}

render();

</script>

</body>
</html>
