<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Beauty and Cheap</title>

<style>
body { font-family: Arial; margin:0; }
nav { background:#000; padding:10px; text-align:center; }
nav button { color:white; background:none; border:none; margin:10px; font-size:16px; cursor:pointer; }

.seccion { display:none; padding:20px; }
.activa { display:block; }

.producto { border:1px solid #ccc; padding:10px; margin:10px; }

button { padding:8px; cursor:pointer; }

</style>
</head>

<body>

<nav>
  <button onclick="mostrar('inicio')">Inicio</button>
  <button onclick="mostrar('productos')">Productos</button>
  <button onclick="mostrar('carrito')">Carrito (<span id="contador">0</span>)</button>
</nav>

<!-- INICIO -->
<div id="inicio" class="seccion activa">
  <h1>Bienvenida a Beauty and Cheap 💄</h1>
  <p>Los mejores productos al mejor precio</p>
</div>

<!-- PRODUCTOS -->
<div id="productos" class="seccion">
  <h2>Productos</h2>

  <div class="producto">
    <p>Labial 💋 - $50</p>
    <button onclick="agregar('Labial',50)">Agregar</button>
  </div>

  <div class="producto">
    <p>Brocha - $35</p>
    <button onclick="agregar('Brocha',35)">Agregar</button>
  </div>

</div>

<!-- CARRITO -->
<div id="carrito" class="seccion">
  <h2>Tu carrito 🛒</h2>
  <ul id="lista"></ul>
  <p>Total: $<span id="total">0</span></p>
</div>

<script>

let carrito = [];
let total = 0;

// cambiar secciones
function mostrar(seccion) {
  document.querySelectorAll('.seccion').forEach(div => {
    div.classList.remove('activa');
  });
  document.getElementById(seccion).classList.add('activa');
}

// agregar productos
function agregar(nombre, precio) {
  carrito.push({nombre, precio});
  total += precio;

  document.getElementById("contador").textContent = carrito.length;
  document.getElementById("total").textContent = total;

  let li = document.createElement("li");
  li.textContent = nombre + " - $" + precio;
  document.getElementById("lista").appendChild(li);
}

</script>

</body>
</html>
